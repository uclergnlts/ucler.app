<style>
/* Layout: one phone-width column like a native app, bottom tabs for app sections (not subjects). Calm infographic style shared with the videos: Manrope + Inter, thin borders, faint grid, yellow highlighter. Light-only brand. */
:root{
  color-scheme:light;
  --bg:#f4f8fc; --surface:#ffffff; --panel:#eef3fa; --ink:#1d3557; --muted:#5f6f88; --line:#dbe4ef;
  --glow:#ffc93c; --glow-soft:#fff3cc; --glow-deep:#e0a400;
  --fizik:#2f7cf6; --kimya:#ee4f78; --biyoloji:#1fa463;
  --fizik-soft:#e5efff; --kimya-soft:#ffe7ee; --biyoloji-soft:#e1f5ea;
  --c1:#2f7cf6; --c2:#ee5a45; --c3:#1fa463; --c4:#f2a516; --c5:#8d55e0;
  --good:#1fa463; --bad:#e2483b;
  --acc:var(--fizik); --acc-soft:var(--fizik-soft);
  --f-display:"Manrope", "Segoe UI", system-ui, sans-serif;
  --f-body:"Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
}
html,body{height:100%}
body{background-color:var(--bg);background-image:linear-gradient(#e9eef5 1px,transparent 1px),linear-gradient(90deg,#e9eef5 1px,transparent 1px);background-size:32px 32px;color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
[data-ders="fizik"]{--acc:var(--fizik);--acc-soft:var(--fizik-soft)}
[data-ders="kimya"]{--acc:var(--kimya);--acc-soft:var(--kimya-soft)}
[data-ders="biyoloji"]{--acc:var(--biyoloji);--acc-soft:var(--biyoloji-soft)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--glow);outline-offset:3px;border-radius:14px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15;font-weight:700;letter-spacing:-.015em}
.app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.view{flex:1;display:flex;flex-direction:column;gap:22px;padding-block:8px 108px}

/* Işıl */
.isil{display:block;overflow:visible}
.isil .halo{transform-origin:60px 100px;animation:pulse 2.6s ease-in-out infinite}
.isil.float{animation:float 3.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.15);opacity:.75}}
@keyframes float{50%{transform:translateY(-5px)}}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:10px;min-height:60px}
.logo{display:flex;align-items:baseline;font-family:var(--f-display);font-weight:800;font-size:26px;letter-spacing:-.02em;color:var(--ink)}
.logo i{font-style:normal;color:#d63c63}
.end .logo{font-size:56px;margin-bottom:6px}
.logo .mark{display:block}
.logo b{color:var(--glow-deep);font-weight:800}
.back{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--surface);border:2px solid var(--line);}
.top .ttl{font-weight:800;font-size:17px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* speech bubble */
.say{display:block}
.say .isil{width:72px;height:78px}
.bubble{position:relative;min-width:0;background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:14px 16px;}
.bubble::before{display:none;content:"";position:absolute;left:-11px;bottom:16px;width:18px;height:18px;background:var(--surface);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg);border-bottom-left-radius:5px}
.bubble h2{font-size:22px;margin-bottom:4px}
.bubble p{margin:0;font-size:17px;line-height:1.55}

/* home */
.hero{background:var(--glow-soft);border-radius:28px;padding:18px 16px 4px;display:grid;gap:6px}
.hero h1{font-size:32px;letter-spacing:-.01em}
.hero .say .bubble{border-color:transparent;background:transparent;padding:0}
.hero .say .bubble::before{border-color:transparent}
.label{font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.resume{display:flex;gap:14px;align-items:center;background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:12px 14px;text-align:left;width:100%}
.resume .dot{width:46px;height:46px;border-radius:14px;background:var(--acc);display:grid;place-items:center;color:#fff;flex:none}
.resume b{display:block;font-weight:800}
.resume span{color:var(--muted);font-size:14px}
.subjects{display:grid;gap:14px}
.subj{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;text-align:left;width:100%;
  border-radius:24px;padding:16px 18px;background:var(--acc-soft);border:2px solid color-mix(in srgb, var(--acc) 30%, transparent);}
.subj h2{font-size:30px;color:var(--acc)}
.subj .badge{width:56px;height:56px;border-radius:18px;background:var(--acc);display:grid;place-items:center;grid-row:span 2}
.subj .badge svg{width:30px;height:30px;color:#fff}
.subj .path{color:var(--ink);font-size:15px;font-weight:600}
.subj .meter{grid-column:1/-1;display:flex;gap:3px;margin-top:12px}
.subj .meter i{flex:1;height:7px;border-radius:4px;background:#fff}
.subj .meter i.r{background:color-mix(in srgb, var(--acc) 40%, #fff)}
.subj .meter i.d{background:var(--acc)}
.subj .count{grid-column:1/-1;font-size:13px;color:var(--muted);font-weight:700;margin-top:4px}

/* subject road */
.band{background:var(--acc-soft);border-radius:28px;padding:18px 16px 6px}
.band h1{font-size:36px;color:var(--acc)}
.road{list-style:none;margin:0;padding:0;display:grid}
.road li{display:grid;grid-template-columns:48px 1fr;gap:12px;position:relative}
.road li::before{content:"";position:absolute;left:22px;top:0;bottom:0;width:4px;border-radius:2px;background:var(--line)}
.road li:first-child::before{top:24px}.road li:last-child::before{bottom:calc(100% - 24px)}
.node{position:relative;z-index:1;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:19px;
  background:var(--bg);border:3px solid var(--line);color:var(--muted)}
.open .node{background:var(--surface);border-color:var(--acc);color:var(--acc);box-shadow:0 4px 0 color-mix(in srgb, var(--acc) 35%, transparent)}
.done .node{background:var(--glow);border-color:var(--glow-deep);color:var(--ink);box-shadow:0 0 0 6px var(--glow-soft)}
.topic{min-width:0;text-align:left;padding:10px 0 20px;width:100%}
.open .topic{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:12px 14px;margin-bottom:14px}
.topic b{display:block;font-size:17px;font-weight:800}
.topic span{display:block;font-size:14px;color:var(--muted)}
.topic .meta{font-size:13px;margin-top:6px;color:var(--acc);font-weight:800}
.soon .topic b{color:var(--muted);font-weight:700}
.soon .topic span{font-size:13px}

/* lesson */
.lesson{padding-block:4px 20px;gap:14px}
.segs{display:flex;gap:4px}
.segs i{flex:1;height:8px;border-radius:4px;background:var(--line)}
.segs i.on{background:var(--acc)}
.card{display:flex;flex-direction:column;gap:6px;animation:in .3s ease-out}
@keyframes in{from{transform:translateY(8px)}to{transform:none}}
.visual{background:var(--surface);border:2px solid var(--line);border-radius:24px;padding:12px;overflow:hidden}
.visual svg{display:block;width:100%;height:auto;max-height:38vh;font-family:var(--f-body)}
.step{font-family:var(--f-display);font-size:14px;font-weight:800;color:var(--acc);margin-top:8px}
.note{display:flex;gap:10px;align-items:flex-start;background:var(--glow-soft);border-radius:16px;padding:12px 14px;font-weight:700;font-size:15px;margin-top:-6px}
.note svg{flex:none;width:22px;height:22px;margin-top:1px}
.controls{position:sticky;bottom:0;display:grid;grid-template-columns:auto 1fr;gap:10px;padding-block:12px calc(12px + env(safe-area-inset-bottom, 0px));background:var(--bg);margin-top:auto}
.btn{height:54px;border-radius:16px;padding:0 20px;font-weight:800;font-size:17px;background:var(--surface);border:2px solid var(--line);transition:transform .08s}
.btn:active{transform:translateY(2px)}
.btn.main{background:var(--acc);border-color:color-mix(in srgb, var(--acc) 70%, #000);color:#fff}
.btn[disabled]{opacity:.45;cursor:default;transform:none}
.opts{display:grid;gap:10px}
.opt{text-align:left;padding:13px 14px;border-radius:16px;background:var(--surface);border:2px solid var(--line);font-size:16px;font-weight:600;display:flex;gap:12px;align-items:center}
.opt .l{flex:none;width:30px;height:30px;border-radius:10px;border:2px solid var(--line);display:grid;place-items:center;font-weight:800;font-size:14px;color:var(--muted)}
.opt.right{border-color:var(--good);background:#e8f8ef} .opt.right .l{background:var(--good);border-color:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad);background:#fdecea} .opt.wrong .l{background:var(--bad);border-color:var(--bad);color:#fff}
.bubble.ok{border-color:var(--good)} .bubble.ok::before{border-color:var(--good)}
.bubble.no{border-color:var(--bad)} .bubble.no::before{border-color:var(--bad)}
.bubble.ok h2{color:var(--good)} .bubble.no h2{color:var(--bad)}
.qdone{font-size:20px;margin:2px 0 6px}
.hero .say{grid-template-columns:96px 1fr}
.hero .say .isil{width:96px;height:104px}
.end{align-items:center;text-align:center;gap:10px;padding-top:12px}
.end .isil{width:150px;height:162px}
.score{font-family:var(--f-display);font-weight:800;font-size:60px;color:var(--acc);line-height:1}
.end p{color:var(--muted);margin:0;font-weight:600}
.end .acts{display:grid;gap:10px;width:100%;margin-top:14px}

/* bottom tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:2px solid var(--line);
  padding:6px max(16px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
.tabs nav{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tab{display:grid;justify-items:center;gap:1px;padding:6px 0;border-radius:14px;font-size:12px;font-weight:800;color:var(--muted)}
.tab svg{width:26px;height:26px}
.tab[aria-current="page"]{color:var(--ink);background:var(--panel)}
/* explore, saved, profile */
.pagehead h1{font-size:30px}
.pagehead p{margin:4px 0 0;color:var(--muted)}
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:0 14px;height:52px}
.search svg{width:22px;height:22px;color:var(--muted);flex:none}
.search input{flex:1;min-width:0;border:0;outline:0;background:none;font:inherit;font-size:16px;color:var(--ink)}
.search:focus-within{border-color:var(--ink)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{height:38px;padding:0 16px;border-radius:999px;border:2px solid var(--line);background:var(--surface);font-weight:700;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.rows{display:grid;gap:10px}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;text-align:left;width:100%;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:12px 14px}
.row .ic{width:40px;height:40px;border-radius:12px;background:var(--acc-soft);color:var(--acc);display:grid;place-items:center}
.row .ic svg{width:22px;height:22px}
.row b{display:block;font-weight:700}
.row span.s{display:block;font-size:14px;color:var(--muted)}
.row .tag{font-size:12px;font-weight:800;color:var(--muted);white-space:nowrap}
.row.soon{background:transparent;border-style:dashed}
.row.soon b{color:var(--muted);font-weight:600}
.empty{text-align:center;color:var(--muted);padding:36px 12px;border:2px dashed var(--line);border-radius:20px}
.prof{display:flex;gap:14px;align-items:center;background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:16px}
.avatar{width:62px;height:62px;border-radius:50%;background:var(--panel);display:grid;place-items:center;color:var(--muted);flex:none}
.avatar svg{width:32px;height:32px}
.prof b{display:block;font-family:var(--f-display);font-size:21px}
.prof span{font-size:14px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:12px;text-align:center}
.stat b{display:block;font-family:var(--f-display);font-size:28px;line-height:1.1}
.stat span{font-size:13px;color:var(--muted);font-weight:600}
.bars{display:grid;gap:12px;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:14px 16px}
.bar{display:grid;gap:6px}
.bar div{display:flex;justify-content:space-between;font-weight:700;font-size:15px}
.bar div span{color:var(--muted);font-weight:600;font-size:14px}
.bar i{display:block;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i em{display:block;height:100%;background:var(--acc);border-radius:4px}
.top .save{margin-left:auto;flex:none}
.top .save[aria-pressed="true"]{background:var(--glow-soft);border-color:var(--glow-deep)}
@media (prefers-reduced-motion: reduce){.card,.isil.float,.isil .halo{animation:none}}
</style>

// Işıl the firefly. moods: idle | happy | think | oops
function isil(mood, cls){
  const navy = '#1d3557', head = '#2b4c7e';
  const eyes = mood === 'happy'

       <circle cx="${mood==='think'?53.5:52.5}" cy="${mood==='think'?41.5:46.5}" r="1.5" fill="#fff"/><circle cx="${mood==='think'?73.5:72.5}" cy="${mood==='think'?41.5:46.5}" r="1.5" fill="#fff"/>`;
  const mouth = mood === 'happy' ? `<path d="M51 58 Q60 71 69 58 Z" fill="#fff"/>`
    : mood === 'think' ? `<circle cx="62" cy="62" r="2.8" fill="#fff"/>`
    : mood === 'oops' ? `<path d="M53 63 Q60 58 67 63" stroke="#fff" stroke-width="2.8" fill="none" stroke-linecap="round"/>`
    : `<path d="M53 59 Q60 66 67 59" stroke="#fff" stroke-width="2.8" fill="none" stroke-linecap="round"/>`;
  return `<svg class="isil ${cls||''}" viewBox="0 0 120 130" aria-hidden="true">
    <circle class="halo" cx="60" cy="100" r="34" fill="url(#isil-halo)"/>
    <ellipse cx="33" cy="72" rx="18" ry="11" transform="rotate(-28 33 72)" fill="#fff" fill-opacity=".9" stroke="#a9c8ec" stroke-width="2.5"/>
    <ellipse cx="87" cy="72" rx="18" ry="11" transform="rotate(28 87 72)" fill="#fff" fill-opacity=".9" stroke="#a9c8ec" stroke-width="2.5"/>
    <ellipse cx="60" cy="102" rx="17" ry="16" fill="#ffc93c"/>
    <ellipse cx="55" cy="97" rx="6.5" ry="5" fill="#fff6cf"/>
    <ellipse cx="60" cy="81" rx="17" ry="11" fill="${navy}"/>
    <path d="M51 27 Q46 14 38 10 M69 27 Q74 14 82 10" stroke="${navy}" stroke-width="3.2" fill="none" stroke-linecap="round"/>
    <circle cx="38" cy="10" r="4.5" fill="#ffc93c"/><circle cx="82" cy="10" r="4.5" fill="#ffc93c"/>
    <circle cx="60" cy="49" r="27" fill="${head}"/>
    ${eyes}
    <ellipse cx="42" cy="59" rx="4.5" ry="2.8" fill="#ff8fa3" fill-opacity=".75"/><ellipse cx="78" cy="59" rx="4.5" ry="2.8" fill="#ff8fa3" fill-opacity=".75"/>
    ${mouth}
  </svg>`;
}
const say = (mood, inner, cls) => `<div class="say"><div class="bubble ${cls||''}">${inner}</div></div>`;
const mark = s => `<svg class="mark" width="${s}" height="${s}" viewBox="0 0 40 40" aria-hidden="true"><g style="mix-blend-mode:multiply"><circle cx="20" cy="14.5" r="10.5" fill="#2f7cf6" fill-opacity=".9"/><circle cx="13.5" cy="25.5" r="10.5" fill="#ee4f78" fill-opacity=".85"/><circle cx="26.5" cy="25.5" r="10.5" fill="#1fa463" fill-opacity=".85"/></g></svg>`;

const app = document.getElementById('app'), tabsNav = document.querySelector('#tabs nav'), tabsBox = document.getElementById('tabs');
let prog = {}, saved = [];
try { saved = JSON.parse(localStorage.getItem('tf-saved') || '[]') || []; } catch(e) { saved = []; }
const saveSaved = () => { try { localStorage.setItem('tf-saved', JSON.stringify(saved)); } catch(e) {} };
try { prog = JSON.parse(localStorage.getItem('tf-prog') || '{}') || {}; } catch(e) { prog = {}; }
const save = () => { try { localStorage.setItem('tf-prog', JSON.stringify(prog)); } catch(e) {} };
const topic = (d, id) => (D[d] || {})[id];
const ready = d => SUBJ[d].list.filter(([id]) => id && topic(d, id));
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const logo = `<div class="logo" aria-label="ucler">ucler<i>.</i></div>`;

function setTabs(cur){
  tabsNav.innerHTML = [['home','Ana sayfa'],['kesfet','Keşfet'],['kayit','Kaydedilenler'],['profil','Profil']].map(([k,l]) =>
    `<button class="tab" data-go="${k}" ${cur===k?'aria-current="page"':''}>${ICON[k]}${l}</button>`).join('');
}
tabsNav.addEventListener('click', e => { const b = e.target.closest('[data-go]'); if (b) go(b.dataset.go === 'home' ? '' : b.dataset.go); });
function go(h){ if (('#'+h) === location.hash || (!h && !location.hash)) route(); else location.hash = h; }

function home(){
  app.removeAttribute('data-ders'); setTabs('home'); tabsBox.hidden = false;
  const last = prog._last && topic(...prog._last.split('.')) ? prog._last.split('.') : null;
  const doneAll = Object.keys(prog).filter(k => k !== '_last').length;
  app.innerHTML = `<header class="top">${logo}</header>
  <main class="view">
    <section class="hero"><h1>Fen, en temelden.</h1>
      ${say(doneAll ? 'happy' : 'idle', `<p>${doneAll ? `Tekrar hoş geldin! Şimdiye kadar <b>${doneAll} konu</b> bitirdin.` : `Her konu kısa, görselli kartlarla anlatılır. Sonunda 4 soruluk bir mini test seni bekler.`}</p>`)}
    </section>
    ${last ? `<section style="display:grid;gap:8px"><div class="label">Kaldığın yer</div>
      <button class="resume" data-ders="${last[0]}" data-open="${last.join('.')}"><span class="dot">${ICON.play}</span><span style="min-width:0"><b>${esc(topic(...last).title)}</b><span>${SUBJ[last[0]].name}</span></span></button></section>` : ''}
    <section style="display:grid;gap:10px"><div class="label">Dersler</div><div class="subjects">
      ${Object.keys(SUBJ).map(d => { const s = SUBJ[d], r = ready(d), n = s.list.length;
        const done = r.filter(([id]) => prog[d+'.'+id]).length;
        return `<button class="subj" data-ders="${d}" data-go="${d}"><h2>${s.name}</h2><span class="badge">${ICON[d]}</span>
          <span class="path">${s.path}</span>
          <span class="meter">${s.list.map(([id]) => `<i class="${id && prog[d+'.'+id] ? 'd' : id && topic(d,id) ? 'r' : ''}"></i>`).join('')}</span>
          <span class="count">${n} konu · ${r.length} tanesi hazır · ${done} tamamlandı</span></button>`; }).join('')}
    </div></section>
  </main>`;
}

function subject(d){
  const s = SUBJ[d]; app.dataset.ders = d; setTabs('kesfet'); tabsBox.hidden = false;
  app.innerHTML = `<header class="top">${logo}</header>
  <main class="view"><section class="band"><h1>${s.name}</h1>${say('idle', `<p>${s.path}. Konular sırayla birbirinin üzerine kurulu, baştan başlamak en iyisi.</p>`)}</section>
  <ol class="road">${s.list.map(([id, name], i) => { const t = id && topic(d, id), done = t && prog[d+'.'+id];
    return t ? `<li class="open ${done?'done':''}"><span class="node">${done ? '★' : i+1}</span><button class="topic" data-open="${d}.${id}"><b>${esc(t.title)}</b><span>${esc(t.summary)}</span><span class="meta">${t.cards.length} kart · ${t.quiz.length} soru${done ? ' · ' + prog[d+'.'+id] : ''}</span></button></li>`
             : `<li class="soon"><span class="node">${i+1}</span><div class="topic"><b>${esc(name)}</b><span>Yakında</span></div></li>`; }).join('')}</ol></main>`;
}

const head = (t, p) => `<header class="top">${logo}</header><main class="view"><section class="pagehead"><h1>${t}</h1>${p ? `<p>${p}</p>` : ''}</section>`;
const row = (d, id) => { const t = topic(d, id), done = prog[d+'.'+id];
  return `<button class="row" data-ders="${d}" data-open="${d}.${id}"><span class="ic">${ICON[d]}</span><span style="min-width:0"><b>${esc(t.title)}</b><span class="s">${SUBJ[d].name} · ${esc(t.summary)}</span></span><span class="tag">${done ? '✓' : t.cards.length + ' kart'}</span></button>`; };
const fold = s => s.toLocaleLowerCase('tr').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/ı/g, 'i');
let exploreFilter = 'all', exploreQ = '';
function explore(){
  app.removeAttribute('data-ders'); setTabs('kesfet'); tabsBox.hidden = false;
  app.innerHTML = head('Keşfet', 'Bütün konular tek yerde. Ara ya da derse göre süz.') +
    `<label class="search">${ICON.kesfet}<input id="q" type="search" placeholder="Konu ara: atom, osmoz, vektör..." value="${esc(exploreQ)}" aria-label="Konu ara"></label>
    <div class="chips">${[['all','Tümü'], ...Object.keys(SUBJ).map(d => [d, SUBJ[d].name])].map(([k,l]) => `<button class="chip" data-chip="${k}" aria-pressed="${exploreFilter===k}">${l}</button>`).join('')}</div>
    <div class="rows" id="res"></div></main>`;
  app.querySelector('#q').addEventListener('input', e => { exploreQ = e.target.value; drawExplore(); });
  drawExplore();
}
function drawExplore(){
  const q = fold(exploreQ.trim()), out = [];
  for (const d of Object.keys(SUBJ)) {
    if (exploreFilter !== 'all' && exploreFilter !== d) continue;
    for (const [id, name] of SUBJ[d].list) {
      const t = id && topic(d, id), text = fold((t ? t.title + ' ' + t.summary + ' ' + t.cards.map(c => c.h).join(' ') : name));
      if (q && !text.includes(q)) continue;
      out.push(t ? row(d, id) : `<div class="row soon" data-ders="${d}"><span class="ic">${ICON[d]}</span><span><b>${esc(name)}</b><span class="s">${SUBJ[d].name}</span></span><span class="tag">Yakında</span></div>`);
    }
  }
  app.querySelector('#res').innerHTML = out.length ? out.join('') : `<div class="empty">"${esc(exploreQ)}" için konu bulunamadı.</div>`;
}
function savedView(){
  app.removeAttribute('data-ders'); setTabs('kayit'); tabsBox.hidden = false;
  const list = saved.map(k => k.split('.')).filter(([d, id]) => SUBJ[d] && topic(d, id));
  app.innerHTML = head('Kaydedilenler', 'Bir konuyu tekrar etmek için ders ekranındaki işaret simgesine dokun.') +
    (list.length ? `<div class="rows">${list.map(([d, id]) => row(d, id)).join('')}</div>` : `<div class="empty">Henüz kaydettiğin bir konu yok.</div>`) + `</main>`;
}
function profile(){
  app.removeAttribute('data-ders'); setTabs('profil'); tabsBox.hidden = false;
  const done = Object.keys(prog).filter(k => k !== '_last' && /\//.test(prog[k]));
  let right = 0, total = 0; done.forEach(k => { const m = String(prog[k]).match(/(\d+)\/(\d+)/); if (m) { right += +m[1]; total += +m[2]; } });
  app.innerHTML = head('Profil') +
    `<section class="prof"><span class="avatar">${ICON.profil}</span><span><b>Misafir</b><span>İlerlemen şimdilik yalnızca bu cihazda saklanıyor.</span></span></section>
    <section class="stats"><div class="stat"><b>${done.length}</b><span>konu bitti</span></div><div class="stat"><b>${total ? Math.round(100*right/total) + '%' : '–'}</b><span>doğru cevap</span></div><div class="stat"><b>${saved.length}</b><span>kayıtlı</span></div></section>
    <section style="display:grid;gap:10px"><div class="label">Derslerdeki ilerleme</div><div class="bars">
      ${Object.keys(SUBJ).map(d => { const r = ready(d), n = r.filter(([id]) => prog[d+'.'+id]).length;
        return `<div class="bar" data-ders="${d}"><div>${SUBJ[d].name}<span>${n} / ${r.length} hazır konu</span></div><i><em style="width:${r.length ? 100*n/r.length : 0}%"></em></i></div>`; }).join('')}
    </div></section>
    <section style="display:grid;gap:10px"><div class="label">Hesap</div>
      <button class="btn" disabled>Hesap oluştur · yakında</button>
      <button class="btn" data-reset>İlerlemeyi sıfırla</button></section></main>`;
}

let L = null;
function lesson(d, id){
  const t = topic(d, id); if (!t) return subject(d);
  app.dataset.ders = d; tabsBox.hidden = true;
  prog._last = d + '.' + id; save();
  L = {d, id, t, i:0, q:-1, picked:null, right:0};
  drawLesson();
}
function drawLesson(){
  const {d, t, i, q} = L, total = t.cards.length + t.quiz.length;
  const pos = q < 0 ? i : t.cards.length + q;
  const segs = `<div class="segs" aria-hidden="true">${Array.from({length: total}, (_, k) => `<i class="${k <= pos ? 'on' : ''}"></i>`).join('')}</div>`;
  const top = `<header class="top"><button class="back" data-back="${d}" aria-label="Konudan çık">${ICON.back}</button><div class="ttl">${esc(t.title)}</div><button class="back save" data-save aria-pressed="${saved.includes(d+'.'+L.id)}" aria-label="Konuyu kaydet">${ICON.kayit}</button></header>`;
  let body = '', ctr = '';
  if (q < 0) {
    const c = t.cards[i], last = i === t.cards.length - 1;
    body = `<article class="card" aria-live="polite"><div class="visual">${c.svg || ''}</div>
      <div class="step">${i+1} / ${t.cards.length}</div>
      ${say(last ? 'happy' : 'idle', `<h2>${c.h}</h2><p>${c.p}</p>`)}
      ${c.key ? `<div class="note">${ICON.bulb}<span>${c.key}</span></div>` : ''}</article>`;
    ctr = `<div class="controls"><button class="btn" data-prev ${i===0?'disabled':''} aria-label="Önceki kart">${ICON.back}</button>
      <button class="btn main" data-next>${last ? 'Mini teste geç' : 'Devam'}</button></div>`;
  } else if (q < t.quiz.length) {
    const Q = t.quiz[q], p = L.picked, ok = p === Q.a;
    body = `<article class="card"><div class="step">Soru ${q+1} / ${t.quiz.length}</div>
      ${p === null ? say('think', `<h2>${Q.q}</h2>`) : `<h2 class="qdone">${Q.q}</h2>`}
      <div class="opts">${Q.o.map((o, k) => `<button class="opt ${p===null?'':k===Q.a?'right':k===p?'wrong':''}" data-pick="${k}" ${p===null?'':'disabled'}><span class="l">${'ABCD'[k]}</span><span>${o}</span></button>`).join('')}</div>
      ${p === null ? '' : say(ok ? 'happy' : 'oops', `<h2>${ok ? 'Doğru!' : 'Doğru cevap ' + 'ABCD'[Q.a]}</h2><p>${Q.e}</p>`, ok ? 'ok' : 'no')}</article>`;
    ctr = `<div class="controls"><span></span><button class="btn main" data-next ${p===null?'disabled':''}>${q === t.quiz.length-1 ? 'Sonucu gör' : 'Sonraki soru'}</button></div>`;
  } else {
    const list = SUBJ[d].list, k = list.findIndex(([x]) => x === L.id), nx = list.slice(k+1).find(([x]) => x && topic(d, x));
    const great = L.right === t.quiz.length, fine = L.right >= t.quiz.length / 2;
    body = `<article class="card end">${logo}<div class="score">${L.right}/${t.quiz.length}</div>
      <h2>${great ? 'Harika, hepsi doğru!' : fine ? 'Güzel gidiyorsun!' : 'Kartlara bir kez daha bakalım.'}</h2>
      <p>${esc(t.title)} tamamlandı.</p>
      <div class="acts">${nx ? `<button class="btn main" data-open="${d}.${nx[0]}">Sıradaki: ${esc(topic(d, nx[0]).title)}</button>` : ''}
      <button class="btn" data-again>Konuyu tekrar et</button><button class="btn" data-back="${d}">${SUBJ[d].name} konularına dön</button></div></article>`;
  }
  app.innerHTML = top + `<main class="view lesson">${segs}${body}${ctr}</main>`;
  scrollTo(0, 0);
}
function step(dir){
  if (!L) return; const t = L.t;
  if (L.q < 0) {
    if (dir > 0) { if (L.i < t.cards.length-1) L.i++; else L.q = 0; }
    else if (L.i > 0) L.i--; else return;
  } else if (L.q < t.quiz.length) {
    if (dir < 0 || L.picked === null) return;
    L.q++; L.picked = null;
    if (L.q === t.quiz.length) { prog[L.d+'.'+L.id] = L.right + '/' + t.quiz.length + ' doğru'; save(); }
  } else return;
  drawLesson();
}

app.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || b.disabled) return;
  if (b.dataset.go) return go(b.dataset.go === 'home' ? '' : b.dataset.go);
  if ('save' in b.dataset && L) { const k = L.d + '.' + L.id, i = saved.indexOf(k); if (i < 0) saved.unshift(k); else saved.splice(i, 1); saveSaved(); b.setAttribute('aria-pressed', i < 0); return; }
  if (b.dataset.chip !== undefined) { exploreFilter = b.dataset.chip; app.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', c === b)); return drawExplore(); }
  if ('reset' in b.dataset) { if (confirm('Tüm ilerlemen ve kaydettiğin konular silinsin mi?')) { prog = {}; saved = []; save(); saveSaved(); profile(); } return; }
  if (b.dataset.open) return go(b.dataset.open);
  if (b.dataset.back) return go(b.dataset.back);
  if ('next' in b.dataset) return step(1);
  if ('prev' in b.dataset) return step(-1);
  if ('again' in b.dataset) { L.i = 0; L.q = -1; L.picked = null; L.right = 0; return drawLesson(); }
  if (b.dataset.pick !== undefined && L && L.picked === null) {
    L.picked = +b.dataset.pick; if (L.picked === L.t.quiz[L.q].a) L.right++; drawLesson();
  }
});
let sx = null, sy = 0;
app.addEventListener('touchstart', e => { if (L && L.q < 0) { sx = e.touches[0].clientX; sy = e.touches[0].clientY; } }, {passive:true});
app.addEventListener('touchend', e => { if (sx === null) return; const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy; sx = null;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) step(dx < 0 ? 1 : -1); }, {passive:true});
document.addEventListener('keydown', e => { if (!L || !tabsBox.hidden) return; if (e.key === 'ArrowRight') step(1); if (e.key === 'ArrowLeft') step(-1); });

function route(){
  const h = decodeURIComponent(location.hash.slice(1));
  const [d, id] = h.split('.');
  if (d && SUBJ[d] && id) return lesson(d, id);
  L = null;
  if (d === 'kesfet') { explore(); return; }
  if (d === 'kayit') { savedView(); scrollTo(0, 0); return; }
  if (d === 'profil') { profile(); scrollTo(0, 0); return; }
  if (d && SUBJ[d]) { subject(d); scrollTo(0, 0); return; }
  home();
}
addEventListener('hashchange', route);
route();
})();
</script>
