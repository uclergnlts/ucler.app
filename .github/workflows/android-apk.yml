name: Android APK
# Telefona kurulabilen deneme APK'sı üretir. Actions > Android APK > son çalışma > "ucler-apk".
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "denetim/**"
      - "docs/**"
      - "video/**"
      - "ios/**"
      - "*.md"
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run app
      - run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
        working-directory: android
      - run: mv android/app/build/outputs/apk/debug/app-debug.apk ucler-${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ucler-apk
          path: ucler-*.apk
          retention-days: 30
