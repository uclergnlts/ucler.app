name: iOS TestFlight
# Uygulamayı Mac'siz derleyip App Store Connect'e (TestFlight) yükler. Actions > iOS TestFlight > Run workflow.
# Gereken sırlar: APPLE_TAKIM_ID, ASC_ANAHTAR_ID, ASC_YAYINCI_ID, ASC_ANAHTAR (.p8 dosyasının içi). Ayrıntı: docs/MAGAZA.md
on:
  workflow_dispatch:
    inputs:
      surum:
        description: "Sürüm adı (mağazada görünür)"
        default: "1.0"
      abonelik:
        description: "Ödeme duvarı açık mı (1 = ucler Plus satın alma görünür; App Store çıkışına kadar 0)"
        default: "0"
jobs:
  testflight:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: xcodebuild -version
      - run: npm ci
      - run: npm run app
        env:
          NEXT_PUBLIC_ABONELIK: ${{ inputs.abonelik }}
      - name: App Store Connect anahtarı
        run: |
          printf '%s' "${{ secrets.ASC_ANAHTAR }}" > "$RUNNER_TEMP/asc.p8"
          cat > "$RUNNER_TEMP/disari.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${{ secrets.APPLE_TAKIM_ID }}</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST
      - name: Derle (archive)
        run: |
          xcodebuild archive -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/ucler.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc.p8" \
            -authenticationKeyID "${{ secrets.ASC_ANAHTAR_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_YAYINCI_ID }}" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TAKIM_ID }}" \
            MARKETING_VERSION="${{ inputs.surum }}" CURRENT_PROJECT_VERSION="${{ github.run_number }}"
      - name: App Store Connect'e yükle
        run: |
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/ucler.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/disari.plist" -exportPath "$RUNNER_TEMP/disari" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc.p8" \
            -authenticationKeyID "${{ secrets.ASC_ANAHTAR_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_YAYINCI_ID }}"
