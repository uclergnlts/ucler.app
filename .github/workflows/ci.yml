name: Denetim
on:
  pull_request:
  push:
    branches: [main]
jobs:
  kontrol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python3 tools/check.py
      # İngilizce çeviri: üretilen dosyalar güncel mi, eksik ya da bayat çeviri var mı (docs/CEVIRI.md)
      - run: python3 tools/ceviri.py birlestir && git diff --exit-code content/en
      - run: node tools/ceviri-ui.js denetle
      - run: npm run lint
      - run: npm run build
