<!doctype html>
<html><head><meta charset="utf-8">

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden}
#stage{position:relative;width:1080px;height:1920px;background:#f6f8fb;color:#1d3557;font-family:Inter,sans-serif;overflow:hidden}

.head{position:absolute;left:80px;right:80px;top:120px;display:flex;justify-content:space-between;align-items:center;font-family:Manrope;font-weight:800;font-size:30px;letter-spacing:3px}
.head .sub{display:flex;align-items:center;gap:16px;color:#d63c63}

.head .brand{letter-spacing:-0.5px;font-size:38px;color:#1d3557}
.head .brand b{color:#d63c63}

.title{position:absolute;left:80px;right:80px;top:195px;font-family:Manrope;font-weight:800;font-size:78px;line-height:1.08;letter-spacing:-1.5px}

svg.v{position:absolute;left:0;top:0;width:1080px;height:1920px;transform:translateY(100px) scale(1.08);transform-origin:540px 960px}
svg text{font-family:Inter;font-weight:600}
.cap{position:absolute;left:80px;width:920px;top:1610px;height:110px;background:#fff;border:2px solid #dbe3ee;border-radius:18px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:50px;box-shadow:0 8px 24px rgba(29,53,87,.08);white-space:nowrap;overflow:hidden}
.cap span{margin:0 7px}

.q{position:absolute;left:80px;right:80px;top:520px;font-family:Manrope;font-weight:800;font-size:92px;line-height:1.1;letter-spacing:-2px}
.q small{display:block;font-size:34px;letter-spacing:3px;color:#d63c63;margin-bottom:34px}
.prog{position:absolute;left:80px;width:920px;top:1755px;height:6px;background:#e1e7ef;border-radius:3px}
.prog i{display:block;height:100%;width:0;background:#d63c63;border-radius:3px}
[data-in]{opacity:0}
</style></head><body><div id="stage"><div class="grid"></div>

  <path id="liqR" d="" fill="#a8dadc"/>
  <path id="oilR" d="" fill="#ffd95a" stroke="#e0a800" stroke-width="2"/>
  <g id="fire2" data-in="21.0"><path d="M245 1165 q20 -45 40 0 q15 -50 30 0 q15 -45 35 0" fill="#ffd95a" stroke="#d63c63" stroke-width="4"/></g>
  <g id="vap"></g>
  <text x="300" y="1240" text-anchor="middle" font-size="32" fill="#5f6f88" data-in="17.2">imbik</text>
  <g data-in="23.6"><text x="110" y="690" font-size="32" fill="#1d3557" font-weight="800">su buharı</text><text x="110" y="728" font-size="26" fill="#5f6f88">kokulu yağı da taşır</text></g>
  <g data-in="27.2"><text x="560" y="960" font-size="32" fill="#1d3557" font-weight="800" text-anchor="middle">yoğuşur</text><text x="560" y="998" text-anchor="middle" font-size="26" fill="#5f6f88">soğuk boru</text></g>
  <g data-in="32.2"><text x="958" y="1135" font-size="30" font-weight="800" fill="#b08600">yağ</text><text x="958" y="1180" font-size="30" font-weight="800" fill="#2a9d8f">su</text></g>
  <text x="540" y="1380" text-anchor="middle" font-family="Manrope" font-size="44" font-weight="800" fill="#1d3557" data-in="31.6">yağ, suyun üstünde katman olur</text>

<!-- 5. Düşün -->
<div class="scene" data-s="46.1" data-e="99">
 <div class="q"><small>DÜŞÜN</small>Deniz suyundan <em>içilebilir su</em> elde etmek için damıtmayı nasıl kullanırdın?</div>
</div>

<div class="cap" id="cap"></div>
<div class="prog"><i id="bar"></i></div>
</div>
<script>
const S = 1;                 // ses hızlandırılmadı
const DUR = 51.72;           // ses süresi
// Konuşma parçaları: [başlangıç, bitiş, metin] (sessizlik tespitinden)
const PH = [
 [0.00,1.32,"Bir gül bahçesi düşün."],[1.57,2.86,"Binlerce yaprak var,"],
 [3.20,6.25,"ama o koku yalnızca birkaç damla yağda saklı."],[6.57,8.39,"Onu yapraklardan nasıl ayırırsın?"],
 [8.67,12.17,"Bin yıldan uzun süre önce simyacılar bunun yolunu buldu:"],[12.45,13.01,"damıtma."],
 [13.31,19.68,"Câbir bin Hayyân ve Ebubekir er-Râzî gibi isimler, imbik denen düzenekle bu yöntemi geliştirdi."],
 [20.01,20.74,"Fikir basit."],[20.97,23.34,"Gül yapraklarını suyla birlikte ısıtırsın."],
 [23.55,26.80,"Yükselen su buharı, kokulu yağı da beraberinde taşır."],
 [27.04,30.95,"Buhar soğuk bir borudan geçerken yoğuşur ve yeniden sıvı olur."],
 [31.28,35.00,"Toplama kabında yağ, suyun üstünde ince bir katman oluşturur."],[35.29,36.33,"Onu ayırıp alırsın."],
 [36.62,41.38,"Simyacılar kurşunu hiçbir zaman altına çeviremedi. Ama damıtma kaybolmadı."],
 [41.63,45.93,"Bugün parfüm, alkol ve yakıt üretimi hâlâ damıtmaya dayanıyor."],
 [46.20,51.70,"Peki sence, deniz suyundan içilebilir su elde etmek için damıtmayı nasıl kullanırdın?"]
];
// kelime zamanları (parça içinde harf sayısıyla orantılı) ve altyazı grupları (en çok 24 harf)
const W = [], CH = [];
PH.forEach(([a,b,txt]) => {
  const ws = txt.split(' '), tot = ws.reduce((s,w)=>s+w.length+1,0); let acc = 0, grp = [], len = 0;
  ws.forEach(w => { const st = a + (b-a)*acc/tot; acc += w.length+1;
    if (grp.length && len + w.length + 1 > 24) { CH.push(grp); grp = []; len = 0; }
    const o = {w, t: st, c: CH.length}; W.push(o); grp.push(o); len += w.length + 1; });
  if (grp.length) CH.push(grp);
});
const ease = x => x<0?0:x>1?1:1-Math.pow(1-x,3);
const cap = document.getElementById('cap'), bar = document.getElementById('bar');
document.querySelectorAll('[data-draw] path, path[data-draw]').forEach(p => { const L = p.getTotalLength(); p.style.strokeDasharray = L; p.dataset.len = L; });
let lastC = -1;
window.render = function (tv) {
  const t = tv * S;
  document.querySelectorAll('.scene').forEach(s => {
    const a = +s.dataset.s, e = +s.dataset.e;
    s.style.opacity = Math.min(ease((t-a)/0.4), 1 - ease((t-e+0.4)/0.4));
  });
  document.querySelectorAll('[data-in]').forEach(el => {
    const k = ease((t - +el.dataset.in)/0.5), b = +(el.dataset.base||0), o = el.dataset.out ? 1 - ease((t - +el.dataset.out)/0.4) : 1;
    el.style.opacity = (b + (1-b)*k) * o; el.style.transform = el.getAttribute('transform') ? '' : `translateY(${(1-k)*24}px)`;
  });
  document.querySelectorAll('[data-draw]').forEach(g => {
    const k = ease((t - +g.dataset.draw)/ +g.dataset.dur);
    (g.tagName==='path'?[g]:g.querySelectorAll('path')).forEach(p => p.style.strokeDashoffset = p.dataset.len*(1-k));
  });
  // başlık değişimi
  const kB = ease((t-20.0)/0.4); document.getElementById('tA').style.opacity = 1-kB; document.getElementById('tB').style.opacity = kB;
  // ateş titrer
  document.getElementById('fire2').setAttribute('transform', `translate(0 ${1165*(1-(1+0.1*Math.sin(t*9)))}) scale(1 ${1+0.1*Math.sin(t*9)})`);
  // buhar tanecikleri boru boyunca ilerler, soğuk bölümde damlaya dönüşür
  const tb = document.getElementById('tube2'), TL = tb.getTotalLength(); let h = '';
  if (t > 23.5 && t < 36.4) for (let j = 0; j < 9; j++) { const u = ((t - 23.5) * 0.28 + j / 9) % 1; if ((t-23.5)*0.28 < j/9) continue;
    const p = tb.getPointAtLength(u * TL); const cold = u > 0.45 && t > 26.9, oil = j % 3 === 0;
    h += cold ? `<path d="M${p.x} ${p.y-9} q7 10 0 16 q-7 -6 0 -16z" fill="${oil ? '#e0a800' : '#2a9d8f'}"/>` : `<circle cx="${p.x}" cy="${p.y}" r="8" fill="${oil ? '#ffd95a' : '#9aa6b6'}" opacity=".9"/>`; }
  document.getElementById('vap').innerHTML = h;
  // toplama kabında su yükselir, yağ üstte ince katman olur
  const wx = y => 90 - (1190 - y) * (30/140);
  const lv = Math.max(0, Math.min(1, (t - 28.0) / 6)), yTop = 1190 - lv * 50;
  document.getElementById('liqR').setAttribute('d', lv > 0 ? `M${850-wx(yTop)} ${yTop} H${850+wx(yTop)} L940 1190 H760 Z` : '');
  const ov = Math.max(0, Math.min(1, (t - 31.3) / 1.8)) * 14, oTop = yTop - ov;
  document.getElementById('oilR').setAttribute('d', ov > 0.5 ? `M${850-wx(oTop)} ${oTop} H${850+wx(oTop)} L${850+wx(yTop)} ${yTop} H${850-wx(yTop)} Z` : '');
  document.getElementById('liqL').setAttribute('opacity', (0.7 - Math.max(0, Math.min(0.35, (t-23.5)/30))).toFixed(2));
  // altyazı
  let i = W.findIndex(o => o.t > t); i = (i === -1 ? W.length : i) - 1; if (i < 0) i = 0;
  const cur = W[i];
  if (cur.c !== lastC) { cap.innerHTML = CH[cur.c].map(o => `<span>${o.w}</span>`).join(''); lastC = cur.c; cap.style.fontSize='50px';
    if (cap.scrollWidth > 880) cap.style.fontSize = Math.floor(50*880/cap.scrollWidth)+'px'; }
  [...cap.children].forEach((s, j) => s.className = CH[cur.c][j] === cur ? 'on' : '');
  bar.style.width = Math.min(100, t/DUR*100) + '%';
};
render(0);
</script></body></html>
