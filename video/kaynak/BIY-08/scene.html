<div class="scene" data-s="87.25" data-e="99">
 <div class="title">Kısaca<br><em>hatırla</em></div>
 <svg class="v" viewBox="0 0 1080 1920">
<g data-in="-1"><rect x="80" y="500" width="920" height="760" rx="18" fill="#fff" stroke="#1fa463" stroke-width="5"/><text x="140" y="590" text-anchor="start" font-size="32" font-weight="800" fill="#1fa463">ÖZET</text><circle cx="160" cy="680" r="14" fill="#1fa463"/><text x="200" y="694" text-anchor="start" font-size="40" font-weight="800" fill="#1d3557">Anahtar-kilit: aktif bölge sert</text><circle cx="160" cy="800" r="14" fill="#1fa463"/><text x="200" y="814" text-anchor="start" font-size="40" font-weight="800" fill="#1d3557">Uyarılmış uyum: enzim</text><text x="200" y="864" text-anchor="start" font-size="40" font-weight="800" fill="#1d3557">substratı sarar</text><circle cx="160" cy="970" r="14" fill="#1fa463"/><text x="200" y="984" text-anchor="start" font-size="40" font-weight="800" fill="#1d3557">Bugün kabul gören:</text><text x="200" y="1034" text-anchor="start" font-size="40" font-weight="800" fill="#1fa463">uyarılmış uyum</text><path d="M140 1090 H940" stroke="#dbe3ee" stroke-width="3"/><path d="M160 1130 h40 v70 l-20 -16 l-20 16 Z" fill="#1fa463"/><text x="230" y="1180" text-anchor="start" font-family="Manrope" font-size="42" font-weight="800" fill="#1fa463">Kaydet, sınavdan önce bak</text></g>
 </svg>
</div>

<div class="cap" id="cap"></div>
<div class="prog"><i id="bar"></i></div>
</div>
<script>
const S = 1;                 // ses hızlandırılmadı
const DUR = 89.4;           // ses süresi
const PH = [
 [0.00,2.37,"Bu enzim, şekeri ısırarak yakalar."],
 [2.82,8.24,"Bin sekiz yüz doksan dörtte Alman kimyacı Emil Fischer, enzimler için bir benzetme yaptı:"],
 [8.56,9.11,"anahtar"],
 [9.33,9.87,"ve kilit."],
 [10.24,12.44,"Enzimin aktif bölgesi bir kilittir,"],
 [12.64,15.05,"substrat da ona tam uyan anahtardır."],
 [15.38,17.47,"Şekil uymazsa tepkime olmaz."],
 [17.77,21.30,"Bu fikir, enzimlerin neden seçici olduğunu güzel anlatıyordu."],
 [21.51,22.87,"Ama bir sorunu vardı."],
 [23.07,27.70,"Bazı moleküller aktif bölgeye rahatça sığıyor, yine de tepkimeye girmiyordu."],
 [27.96,29.21,"Örneğin hekzokinaz."],
 [29.51,33.52,"Bu enzim, hücreye giren glikoza ATP'den bir fosfat aktarır."],
 [33.86,38.06,"Su molekülü glikozdan çok küçüktür ve aktif bölgeye kolayca girer."],
 [38.39,44.78,"Kilit gibi sert bir enzim, fosfatı suya da aktarabilirdi. Ama hekzokinaz bunu neredeyse hiç yapmaz."],
 [45.14,50.37,"Bin dokuz yüz elli sekizde Amerikalı biyokimyacı Daniel Koshland yeni bir model önerdi:"],
 [50.62,51.60,"uyarılmış uyum."],
 [51.90,53.43,"Aktif bölge sert değil,"],
 [53.66,54.27,"esnektir."],
 [54.56,59.10,"Doğru substrat bağlanınca enzim şeklini değiştirir ve onu sıkıca sarar,"],
 [59.43,61.57,"tıpkı eldivenin ele oturması gibi."],
 [61.86,67.22,"Hekzokinazın iki parçası glikozun üstüne bir çene gibi kapanır ve suyu dışarıda bırakır."],
 [67.52,70.09,"Tepkime ancak bu kapanmadan sonra başlar."],
 [70.44,73.22,"Sonradan çekilen kristal yapılar bunu doğruladı:"],
 [73.42,75.23,"enzim gerçekten kapanıyordu."],
 [75.45,77.52,"Yani enzim, sert bir kilit değil;"],
 [77.74,80.33,"doğru eli tanıyınca kapanan bir eldivendir."],
 [80.76,86.84,"Peki sence, laktaz neden süt şekerini parçalar da ona çok benzeyen çay şekerini parçalamaz?"]
];

// kelime zamanları (parça içinde harf sayısıyla orantılı) ve altyazı grupları (en çok 24 harf)
const W = [], CH = [];
PH.forEach(([a,b,txt]) => {
  const ws = txt.split(' '), tot = ws.reduce((s,w)=>s+w.length+1,0); let acc = 0, grp = [], len = 0;
  ws.forEach(w => { const st = a + (b-a)*acc/tot; acc += w.length+1;
    if (grp.length && len + w.length + 1 > 24) { CH.push(grp); grp = []; len = 0; }
    const o = {w, t: st, c: CH.length}; W.push(o); grp.push(o); len += w.length + 1; });
  if (grp.length) CH.push(grp);
});
const ease = x => x<0?0:x>1?1:1-Math.pow(1-x,3);
const cap = document.getElementById('cap'), bar = document.getElementById('bar');
document.querySelectorAll('[data-draw] path, path[data-draw]').forEach(p => { const L = p.getTotalLength(); p.style.strokeDasharray = L; p.dataset.len = L; });
let lastC = -1;
window.render = function (tv) {
  const t = tv * S;
  document.querySelectorAll('.scene').forEach(s => {
    const a = +s.dataset.s, e = +s.dataset.e;
    s.style.opacity = Math.min(ease((t-a)/0.4), 1 - ease((t-e+0.4)/0.4));
  });
  document.querySelectorAll('[data-in]').forEach(el => {
    const k = ease((t - +el.dataset.in)/0.5), b = +(el.dataset.base||0), o = el.dataset.out ? 1 - ease((t - +el.dataset.out)/0.4) : 1;
    el.style.opacity = (b + (1-b)*k) * o; el.style.transform = el.getAttribute('transform') ? '' : `translateY(${(1-k)*24}px)`;
  });
  document.querySelectorAll('[data-draw]').forEach(g => {
    const k = ease((t - +g.dataset.draw)/ +g.dataset.dur);
    (g.tagName==='path'?[g]:g.querySelectorAll('path')).forEach(p => p.style.strokeDashoffset = p.dataset.len*(1-k));
  });
  // altyazı
  let i = W.findIndex(o => o.t > t); i = (i === -1 ? W.length : i) - 1; if (i < 0) i = 0;
  const cur = W[i];
  if (cur.c !== lastC) { cap.innerHTML = CH[cur.c].map(o => `<span>${o.w}</span>`).join(''); lastC = cur.c; cap.style.fontSize='50px';
    if (cap.scrollWidth > 880) cap.style.fontSize = Math.floor(50*880/cap.scrollWidth)+'px'; }
  [...cap.children].forEach((s, j) => s.className = CH[cur.c][j] === cur ? 'on' : '');
  cap.style.opacity = t > 87.0 ? 0 : 1;
  bar.style.width = Math.min(100, t/DUR*100) + '%';
};
render(0);
</script></body></html>
