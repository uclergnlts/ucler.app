<style>

<g data-in="59.1"><path d="M160 760 V1200 H900" fill="none" stroke="#1d3557" stroke-width="4"/><text x="170" y="740" text-anchor="start" font-size="28" font-weight="800" fill="#5f6f88">enzim etkinliği</text><text x="880" y="1250" text-anchor="end" font-size="28" font-weight="800" fill="#5f6f88">sıcaklık</text></g><path data-draw="59.2" data-dur="1.6" d="M200 1180 C380 1170 470 820 600 820 C680 820 700 1000 740 1180" fill="none" stroke="#1fa463" stroke-width="7"/><g data-in="60.3"><path d="M600 820 V1200" stroke="#d63c63" stroke-width="3" stroke-dasharray="10 8"/><text x="600" y="1250" text-anchor="middle" font-size="30" font-weight="800" fill="#d63c63">37 °C</text></g><g data-in="62.5"><text x="900" y="1300" text-anchor="end" font-size="28" font-weight="800" fill="#d63c63">yüksek: enzim bozulur</text></g><g data-in="65.6"><text x="170" y="1300" text-anchor="start" font-size="28" font-weight="800" fill="#457b9d">düşük: tepkime yavaşlar</text></g><g data-in="68.2"><rect x="140" y="1340" width="800" height="110" rx="18" fill="#fff" stroke="#dbe3ee" stroke-width="3"/><text x="540" y="1385" text-anchor="middle" font-size="30" font-weight="800" fill="#1d3557">bir hipotez: mantarlardan korunma</text><text x="540" y="1428" text-anchor="middle" font-size="28" font-weight="600" fill="#5f6f88">ile enerji harcaması arasında denge</text></g>

<div class="scene" data-s="75.88" data-e="99">
 <div class="q"><small>DÜŞÜN</small>Ateşin çıkarken neden <em>üşürsün</em> ve titrersin?</div>
</div>

<div class="cap" id="cap"></div>
<div class="prog"><i id="bar"></i></div>
</div>
<script>
const S = 1;                 // ses hızlandırılmadı
const DUR = 79.88;           // ses süresi
const PH = [
 [0.00,1.69,"Bin sekiz yüz altmış sekiz."],
 [2.01,3.83,"Alman hekim Carl Wunderlich,"],
 [4.04,8.09,"yirmi beş bin hastanın koltuk altı sıcaklığını tekrar tekrar ölçüyor."],
 [8.31,10.31,"Toplamda bir milyonu aşan ölçüm."],
 [10.61,11.07,"Sonuç:"],
 [11.36,15.11,"sağlıklı bir insanın vücut sıcaklığı otuz yedi derece civarında."],
 [15.34,19.77,"Bugünkü ölçümler biraz daha düşük, otuz altı buçukla otuz yedi arasında."],
 [19.99,23.51,"Ama asıl şaşırtıcı olan, bu sayının ne kadar az oynaması."],
 [23.73,30.23,"Kışın eksi on derecede de, yazın kırk derecede de iç sıcaklığın ancak birkaç onda bir derece değişir."],
 [30.55,34.90,"Dış koşullar değişirken iç ortamı sabit tutmaya homeostazi denir."],
 [35.13,38.15,"Bu işi beyninin tabanındaki hipotalamus yönetir."],
 [38.39,39.84,"Bir termostat gibi çalışır."],
 [40.12,42.48,"Vücut ısınınca deri damarları genişler,"],
 [42.79,43.91,"ter bezleri çalışır."],
 [44.14,46.55,"Ter buharlaşırken ısıyı alıp götürür."],
 [46.87,52.58,"Vücut soğuyunca deri damarları daralır, tüylerin diken diken olur ve kasların titremeye başlar."],
 [52.91,56.78,"Titreme, kasların ısı üretmek için yaptığı hızlı kasılmalardır."],
 [57.07,58.79,"Peki neden tam otuz yedi?"],
 [59.06,62.23,"Vücudundaki enzimler bu sıcaklıkta en iyi çalışır."],
 [62.46,67.84,"Sıcaklık çok yükselirse enzimlerin şekli bozulur, çok düşerse tepkimeler yavaşlar."],
 [68.17,75.59,"Bir açıklamaya göre bu sıcaklık, mantarlardan korunmakla fazla enerji harcamamak arasındaki en iyi denge noktasıdır."],
 [75.88,79.88,"Peki sence, ateşin çıkarken neden üşürsün ve titrersin?"]
];

// kelime zamanları (parça içinde harf sayısıyla orantılı) ve altyazı grupları (en çok 24 harf)
const W = [], CH = [];
PH.forEach(([a,b,txt]) => {
  const ws = txt.split(' '), tot = ws.reduce((s,w)=>s+w.length+1,0); let acc = 0, grp = [], len = 0;
  ws.forEach(w => { const st = a + (b-a)*acc/tot; acc += w.length+1;
    if (grp.length && len + w.length + 1 > 24) { CH.push(grp); grp = []; len = 0; }
    const o = {w, t: st, c: CH.length}; W.push(o); grp.push(o); len += w.length + 1; });
  if (grp.length) CH.push(grp);
});
const ease = x => x<0?0:x>1?1:1-Math.pow(1-x,3);
const cap = document.getElementById('cap'), bar = document.getElementById('bar');
document.querySelectorAll('[data-draw] path, path[data-draw]').forEach(p => { const L = p.getTotalLength(); p.style.strokeDasharray = L; p.dataset.len = L; });
let lastC = -1;
window.render = function (tv) {
  const t = tv * S;
  document.querySelectorAll('.scene').forEach(s => {
    const a = +s.dataset.s, e = +s.dataset.e;
    s.style.opacity = Math.min(ease((t-a)/0.4), 1 - ease((t-e+0.4)/0.4));
  });
  document.querySelectorAll('[data-in]').forEach(el => {
    const k = ease((t - +el.dataset.in)/0.5), b = +(el.dataset.base||0), o = el.dataset.out ? 1 - ease((t - +el.dataset.out)/0.4) : 1;
    el.style.opacity = (b + (1-b)*k) * o; el.style.transform = el.getAttribute('transform') ? '' : `translateY(${(1-k)*24}px)`;
  });
  document.querySelectorAll('[data-draw]').forEach(g => {
    const k = ease((t - +g.dataset.draw)/ +g.dataset.dur);
    (g.tagName==='path'?[g]:g.querySelectorAll('path')).forEach(p => p.style.strokeDashoffset = p.dataset.len*(1-k));
  });
  // altyazı
  let i = W.findIndex(o => o.t > t); i = (i === -1 ? W.length : i) - 1; if (i < 0) i = 0;
  const cur = W[i];
  if (cur.c !== lastC) { cap.innerHTML = CH[cur.c].map(o => `<span>${o.w}</span>`).join(''); lastC = cur.c; cap.style.fontSize='50px';
    if (cap.scrollWidth > 880) cap.style.fontSize = Math.floor(50*880/cap.scrollWidth)+'px'; }
  [...cap.children].forEach((s, j) => s.className = CH[cur.c][j] === cur ? 'on' : '');
  bar.style.width = Math.min(100, t/DUR*100) + '%';
};
render(0);
</script></body></html>
