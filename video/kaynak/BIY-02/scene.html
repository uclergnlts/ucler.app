 <div class="q"><small>DÜŞÜN</small>Hücre ATP'yi neden <em>depolamıyor</em> da her an yeniden üretiyor?</div>

<div class="prog"><i id="bar"></i></div>
</div>
<script>
const S = 1;                 // ses hızlandırılmadı
const DUR = 81.01;           // ses süresi
const PH = [
 [0.00,2.41,"Şu an bu cümleyi okurken kalbin atıyor,"],
 [2.69,4.34,"gözlerin satırlarda kayıyor,"],
 [4.56,7.00,"beynindeki sinir hücreleri sinyal gönderiyor."],
 [7.29,9.01,"Bunların hepsi enerji ister."],
 [9.34,12.06,"Peki hücre bu enerjiyi hangi biçimde kullanır?"],
 [12.50,18.26,"Bin dokuz yüz yirmi dokuzda Alman biyokimyacı Karl Lohmann, kas özütünde yeni bir molekül buldu:"],
 [18.56,19.85,"adenozin trifosfat,"],
 [20.15,20.95,"kısaca ATP."],
 [21.00,27.52,"On iki yıl sonra Fritz Lipmann, hücrelerin enerjiyi hep bu molekül üzerinden alıp verdiğini öne sürdü."],
 [27.92,29.62,"ATP'nin yapısı basittir:"],
 [29.92,31.17,"adenin denen bir baz,"],
 [31.38,34.32,"riboz şekeri ve uç uca bağlı üç fosfat."],
 [34.68,38.14,"Hücre bir iş yapacağı zaman ATP suyla tepkimeye girer."],
 [38.51,43.92,"Uçtaki fosfat ayrılır, geriye ADP kalır ve açığa çıkan enerji işe harcanır."],
 [44.23,48.53,"Kasın kasılması, aktif taşıma, protein yapımı hep bu yolla olur."],
 [48.99,52.02,"Peki besindeki enerji neden doğrudan kullanılmıyor?"],
 [52.32,55.00,"Bir glikoz molekülü büyük bir banknot gibidir."],
 [55.31,57.67,"Hücre ise küçük bozuk paraya ihtiyaç duyar."],
 [58.10,62.66,"Hücresel solunum, bir glikozdaki enerjiyi otuz kadar ATP'ye bozdurur."],
 [63.04,65.78,"ATP depolanmaz, sürekli yeniden yapılır."],
 [66.15,70.25,"Vücudunda herhangi bir anda yalnızca birkaç yüz gram ATP vardır."],
 [70.61,75.08,"Ama bir günde neredeyse kendi ağırlığın kadar ATP üretip harcarsın."],
 [75.40,81.01,"Peki sence, hücre ATP'yi neden büyük miktarda depolamıyor da her an yeniden üretiyor?"]
];

// kelime zamanları (parça içinde harf sayısıyla orantılı) ve altyazı grupları (en çok 24 harf)
const W = [], CH = [];
PH.forEach(([a,b,txt]) => {
  const ws = txt.split(' '), tot = ws.reduce((s,w)=>s+w.length+1,0); let acc = 0, grp = [], len = 0;
  ws.forEach(w => { const st = a + (b-a)*acc/tot; acc += w.length+1;
    if (grp.length && len + w.length + 1 > 24) { CH.push(grp); grp = []; len = 0; }
    const o = {w, t: st, c: CH.length}; W.push(o); grp.push(o); len += w.length + 1; });
  if (grp.length) CH.push(grp);
});
const ease = x => x<0?0:x>1?1:1-Math.pow(1-x,3);
const cap = document.getElementById('cap'), bar = document.getElementById('bar');
document.querySelectorAll('[data-draw] path, path[data-draw]').forEach(p => { const L = p.getTotalLength(); p.style.strokeDasharray = L; p.dataset.len = L; });
let lastC = -1;
window.render = function (tv) {
  const t = tv * S;
  document.querySelectorAll('.scene').forEach(s => {
    const a = +s.dataset.s, e = +s.dataset.e;
    s.style.opacity = Math.min(ease((t-a)/0.4), 1 - ease((t-e+0.4)/0.4));
  });
  document.querySelectorAll('[data-in]').forEach(el => {
    const k = ease((t - +el.dataset.in)/0.5), b = +(el.dataset.base||0), o = el.dataset.out ? 1 - ease((t - +el.dataset.out)/0.4) : 1;
    el.style.opacity = (b + (1-b)*k) * o; el.style.transform = el.getAttribute('transform') ? '' : `translateY(${(1-k)*24}px)`;
  });
  document.querySelectorAll('[data-draw]').forEach(g => {
    const k = ease((t - +g.dataset.draw)/ +g.dataset.dur);
    (g.tagName==='path'?[g]:g.querySelectorAll('path')).forEach(p => p.style.strokeDashoffset = p.dataset.len*(1-k));
  });
  // altyazı
  let i = W.findIndex(o => o.t > t); i = (i === -1 ? W.length : i) - 1; if (i < 0) i = 0;
  const cur = W[i];
  if (cur.c !== lastC) { cap.innerHTML = CH[cur.c].map(o => `<span>${o.w}</span>`).join(''); lastC = cur.c; cap.style.fontSize='50px';
    if (cap.scrollWidth > 880) cap.style.fontSize = Math.floor(50*880/cap.scrollWidth)+'px'; }
  [...cap.children].forEach((s, j) => s.className = CH[cur.c][j] === cur ? 'on' : '');
  bar.style.width = Math.min(100, t/DUR*100) + '%';
};
render(0);
</script></body></html>
