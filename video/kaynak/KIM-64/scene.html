<g data-in="-1"><rect x="80" y="500" width="920" height="700" rx="18" fill="#fff" stroke="#d63c63" stroke-width="5"/><text x="140" y="590" text-anchor="start" font-size="32" font-weight="800" fill="#d63c63">ÖZET</text><circle cx="160" cy="680" r="14" fill="#d63c63"/><text x="200" y="694" text-anchor="start" font-size="40" font-weight="800" fill="#1d3557">Yükseltgenme:</text><text x="200" y="744" text-anchor="start" font-size="40" font-weight="800" fill="#d63c63">elektron verir</text><circle cx="160" cy="830" r="14" fill="#d63c63"/><text x="200" y="844" text-anchor="start" font-size="40" font-weight="800" fill="#1d3557">İndirgenme:</text><text x="200" y="894" text-anchor="start" font-size="40" font-weight="800" fill="#3a86c8">elektron alır</text><circle cx="160" cy="980" r="14" fill="#d63c63"/><text x="200" y="994" text-anchor="start" font-size="40" font-weight="800" fill="#1d3557">İkisi hep birlikte:</text><text x="200" y="1044" text-anchor="start" font-size="40" font-weight="800" fill="#d63c63">redoks</text><path d="M140 1080 H940" stroke="#dbe3ee" stroke-width="3"/><path d="M160 1110 h40 v70 l-20 -16 l-20 16 Z" fill="#d63c63"/><text x="230" y="1160" text-anchor="start" font-family="Manrope" font-size="42" font-weight="800" fill="#d63c63">Kaydet, sınavdan önce bak</text></g>
 </svg>
</div>

<div class="cap" id="cap"></div>
<div class="prog"><i id="bar"></i></div>
</div>
<script>
const S = 1;                 // ses hızlandırılmadı
const DUR = 82.2;           // ses süresi
const PH = [
 [0.00,2.54,"Bu kırmızı toz, bir zamanlar demirdi."],
 [2.78,4.34,"Bir bisikleti yağmurda bırak."],
 [4.56,8.70,"Birkaç hafta sonra zincirinde kırmızı kahverengi bir katman görürsün:"],
 [9.05,9.40,"pas."],
 [9.71,14.49,"Pas, demirin kirlenmesi değildir. Demir atomları başka bir maddeye dönüşmüştür."],
 [14.80,17.12,"Olan şey bir elektron alışverişidir."],
 [17.37,21.45,"Demir atomları elektron verir ve artı yüklü demir iyonlarına dönüşür."],
 [21.76,24.01,"Havadaki oksijen bu elektronları alır."],
 [24.22,25.63,"Bunun için su da gerekir."],
 [25.87,30.12,"Sonunda demir iyonları oksijen ve suyla birleşir ve pas oluşur."],
 [30.48,33.62,"Bir atomun elektron vermesine yükseltgenme denir."],
 [33.84,36.32,"Elektron almasına ise indirgenme denir."],
 [36.56,38.52,"Paslanmada demir yükseltgenir,"],
 [38.73,39.95,"oksijen indirgenir."],
 [40.16,41.81,"İkisi her zaman birlikte olur."],
 [42.08,46.37,"Çünkü verilen elektron yok olamaz; mutlaka başka bir atom onu alır."],
 [46.58,50.48,"Bu yüzden bu tepkimelere, iki adın birleşimiyle redoks denir."],
 [50.81,52.25,"Redoks her yerdedir."],
 [52.48,56.28,"Sofra tuzu oluşurken sodyum bir elektron verir, klor alır."],
 [56.51,58.66,"Odun yanarken yakıt yükseltgenir,"],
 [58.87,60.08,"oksijen indirgenir."],
 [60.33,63.67,"Hücrelerinde glikoz yükseltgenir ve sana enerji verir."],
 [63.88,68.11,"Pil de elektronları bir telden geçirerek çalışan bir redoks düzeneğidir."],
 [68.35,71.45,"Demiri korumanın bir yolu, onu çinkoyla kaplamaktır."],
 [71.66,74.22,"Çinko, demirden daha kolay elektron verir."],
 [74.44,79.68,"Peki sence, çinko kaplı bir demirin yüzeyi çizilirse, önce hangisi yükseltgenir?"]
];

// kelime zamanları (parça içinde harf sayısıyla orantılı) ve altyazı grupları (en çok 24 harf)
const W = [], CH = [];
PH.forEach(([a,b,txt]) => {
  const ws = txt.split(' '), tot = ws.reduce((s,w)=>s+w.length+1,0); let acc = 0, grp = [], len = 0;
  ws.forEach(w => { const st = a + (b-a)*acc/tot; acc += w.length+1;
    if (grp.length && len + w.length + 1 > 24) { CH.push(grp); grp = []; len = 0; }
    const o = {w, t: st, c: CH.length}; W.push(o); grp.push(o); len += w.length + 1; });
  if (grp.length) CH.push(grp);
});
const ease = x => x<0?0:x>1?1:1-Math.pow(1-x,3);
const cap = document.getElementById('cap'), bar = document.getElementById('bar');
document.querySelectorAll('[data-draw] path, path[data-draw]').forEach(p => { const L = p.getTotalLength(); p.style.strokeDasharray = L; p.dataset.len = L; });
let lastC = -1;
window.render = function (tv) {
  const t = tv * S;
  document.querySelectorAll('.scene').forEach(s => {
    const a = +s.dataset.s, e = +s.dataset.e;
    s.style.opacity = Math.min(ease((t-a)/0.4), 1 - ease((t-e+0.4)/0.4));
  });
  document.querySelectorAll('[data-in]').forEach(el => {
    const k = ease((t - +el.dataset.in)/0.5), b = +(el.dataset.base||0), o = el.dataset.out ? 1 - ease((t - +el.dataset.out)/0.4) : 1;
    el.style.opacity = (b + (1-b)*k) * o; el.style.transform = el.getAttribute('transform') ? '' : `translateY(${(1-k)*24}px)`;
  });
  document.querySelectorAll('[data-draw]').forEach(g => {
    const k = ease((t - +g.dataset.draw)/ +g.dataset.dur);
    (g.tagName==='path'?[g]:g.querySelectorAll('path')).forEach(p => p.style.strokeDashoffset = p.dataset.len*(1-k));
  });
  // altyazı
  let i = W.findIndex(o => o.t > t); i = (i === -1 ? W.length : i) - 1; if (i < 0) i = 0;
  const cur = W[i];
  if (cur.c !== lastC) { cap.innerHTML = CH[cur.c].map(o => `<span>${o.w}</span>`).join(''); lastC = cur.c; cap.style.fontSize='50px';
    if (cap.scrollWidth > 880) cap.style.fontSize = Math.floor(50*880/cap.scrollWidth)+'px'; }
  [...cap.children].forEach((s, j) => s.className = CH[cur.c][j] === cur ? 'on' : '');
  cap.style.opacity = t > 79.6 ? 0 : 1;
  bar.style.width = Math.min(100, t/DUR*100) + '%';
};
render(0);
</script></body></html>
