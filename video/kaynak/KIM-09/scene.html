e cx="491.6" cy="882.0" r="11" fill="#ffd95a" stroke="#e0a800" stroke-width="3"/></g><g data-in="35.0"><circle cx="780" cy="760" r="12" fill="#457b9d"/><text x="805" y="770" text-anchor="start" font-size="30" font-weight="700" fill="#1d3557">su</text><rect x="768" y="808" width="24" height="24" fill="#fff" stroke="#1d3557" stroke-width="3"/><text x="805" y="830" text-anchor="start" font-size="30" font-weight="700" fill="#1d3557">şeker</text><circle cx="780" cy="880" r="12" fill="#ffd95a" stroke="#e0a800" stroke-width="3"/><text x="805" y="890" text-anchor="start" font-size="30" font-weight="700" fill="#1d3557">limon suyu</text></g><g data-in="39.3"><text x="540" y="1200" text-anchor="middle" font-size="34" font-weight="800" fill="#1d3557">oran istediğin gibi değişir</text></g><g data-in="41.8"><text x="540" y="1250" text-anchor="middle" font-size="34" font-weight="800" fill="#1d3557">her bileşen özelliğini korur</text></g><g data-in="44.0"><text x="540" y="1400" text-anchor="middle" font-family="Manrope" font-size="42" font-weight="800" fill="#d63c63">saf madde: element ve bileşik</text></g>

<div class="scene" data-s="47.3" data-e="99">
 <div class="q"><small>DÜŞÜN</small>Soluduğun <em>hava</em> bir bileşik mi, yoksa karışım mı?</div>
</div>

<div class="cap" id="cap"></div>
<div class="prog"><i id="bar"></i></div>
</div>
<script>
const S = 1;                 // ses hızlandırılmadı
const DUR = 51.41;           // ses süresi
const PH = [
 [0.00,0.88,"Saf altın,"],
 [1.08,3.39,"saf su ve bir bardak limonata."],
 [3.65,4.44,"Üçü de madde,"],
 [4.72,7.61,"ama bir kimyacı onları üç ayrı kutuya koyar."],
 [7.99,9.43,"Altın bir elementtir."],
 [9.68,13.83,"Yalnızca tek tür atomdan oluşur ve daha basit bir maddeye ayrılamaz."],
 [14.08,15.47,"Su bir bileşiktir."],
 [15.77,20.36,"Hidrojen ve oksijen atomları belirli bir oranda, kimyasal bağla birleşmiştir."],
 [20.62,21.53,"İlginç olan şu:"],
 [21.78,25.23,"hidrojen yanıcı bir gazdır, oksijen yanmayı besler,"],
 [25.45,28.51,"ama birleşince yangını söndüren suyu oluştururlar."],
 [28.80,32.63,"Bileşiğin özellikleri, onu oluşturan elementlerinkinden farklıdır."],
 [32.91,34.64,"Limonata ise bir karışımdır."],
 [34.90,38.98,"Su, şeker ve limon suyu yeni bir bileşik oluşturmadan karışır."],
 [39.21,43.57,"Oranı istediğin gibi değiştirebilirsin ve her bileşen kendi özelliğini korur."],
 [43.90,45.95,"Element ve bileşik saf maddedir,"],
 [46.18,47.09,"karışım değildir."],
 [47.37,51.41,"Peki sence, soluduğun hava bir bileşik mi, yoksa karışım mı?"]
];

// kelime zamanları (parça içinde harf sayısıyla orantılı) ve altyazı grupları (en çok 24 harf)
const W = [], CH = [];
PH.forEach(([a,b,txt]) => {
  const ws = txt.split(' '), tot = ws.reduce((s,w)=>s+w.length+1,0); let acc = 0, grp = [], len = 0;
  ws.forEach(w => { const st = a + (b-a)*acc/tot; acc += w.length+1;
    if (grp.length && len + w.length + 1 > 24) { CH.push(grp); grp = []; len = 0; }
    const o = {w, t: st, c: CH.length}; W.push(o); grp.push(o); len += w.length + 1; });
  if (grp.length) CH.push(grp);
});
const ease = x => x<0?0:x>1?1:1-Math.pow(1-x,3);
const cap = document.getElementById('cap'), bar = document.getElementById('bar');
document.querySelectorAll('[data-draw] path, path[data-draw]').forEach(p => { const L = p.getTotalLength(); p.style.strokeDasharray = L; p.dataset.len = L; });
let lastC = -1;
window.render = function (tv) {
  const t = tv * S;
  document.querySelectorAll('.scene').forEach(s => {
    const a = +s.dataset.s, e = +s.dataset.e;
    s.style.opacity = Math.min(ease((t-a)/0.4), 1 - ease((t-e+0.4)/0.4));
  });
  document.querySelectorAll('[data-in]').forEach(el => {
    const k = ease((t - +el.dataset.in)/0.5), b = +(el.dataset.base||0), o = el.dataset.out ? 1 - ease((t - +el.dataset.out)/0.4) : 1;
    el.style.opacity = (b + (1-b)*k) * o; el.style.transform = el.getAttribute('transform') ? '' : `translateY(${(1-k)*24}px)`;
  });
  document.querySelectorAll('[data-draw]').forEach(g => {
    const k = ease((t - +g.dataset.draw)/ +g.dataset.dur);
    (g.tagName==='path'?[g]:g.querySelectorAll('path')).forEach(p => p.style.strokeDashoffset = p.dataset.len*(1-k));
  });
  // altyazı
  let i = W.findIndex(o => o.t > t); i = (i === -1 ? W.length : i) - 1; if (i < 0) i = 0;
  const cur = W[i];
  if (cur.c !== lastC) { cap.innerHTML = CH[cur.c].map(o => `<span>${o.w}</span>`).join(''); lastC = cur.c; cap.style.fontSize='50px';
    if (cap.scrollWidth > 880) cap.style.fontSize = Math.floor(50*880/cap.scrollWidth)+'px'; }
  [...cap.children].forEach((s, j) => s.className = CH[cur.c][j] === cur ? 'on' : '');
  bar.style.width = Math.min(100, t/DUR*100) + '%';
};
render(0);
</script></body></html>
