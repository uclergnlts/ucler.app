<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../sablon/fonts-local.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden}
#stage{position:relative;width:1080px;height:1920px;background:#f6f8fb;color:#1d3557;font-family:Inter,sans-serif;overflow:hidden}
.grid{position:absolute;inset:0;background-image:linear-gradient(#e6ecf3 1px,transparent 1px),linear-gradient(90deg,#e6ecf3 1px,transparent 1px);background-size:60px 60px;opacity:.55}
.head{position:absolute;left:80px;right:80px;top:120px;display:flex;justify-content:space-between;align-items:center;font-family:Manrope;font-weight:800;font-size:30px;letter-spacing:3px}
.head .sub{display:flex;align-items:center;gap:16px;color:#d63c63}
.head .sub i{display:block;width:44px;height:6px;background:#d63c63;border-radius:3px}
.head .brand{letter-spacing:-0.5px;font-size:38px;color:#1d3557}
.head .brand b{color:#d63c63}
.scene{position:absolute;inset:0;opacity:0}
.title{position:absolute;left:80px;right:80px;top:195px;font-family:Manrope;font-weight:800;font-size:78px;line-height:1.08;letter-spacing:-1.5px}
em{font-style:normal;background:linear-gradient(transparent 62%,#ffd95a 62%)}
svg.v{position:absolute;left:0;top:0;width:1080px;height:1920px;transform:translateY(100px) scale(1.08);transform-origin:540px 960px}
svg text{font-family:Inter;font-weight:600}
.cap{position:absolute;left:80px;width:920px;top:1610px;height:110px;background:#fff;border:2px solid #dbe3ee;border-radius:18px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:50px;box-shadow:0 8px 24px rgba(29,53,87,.08);white-space:nowrap;overflow:hidden}
.cap span{margin:0 7px}
.cap span.on{background:linear-gradient(transparent 58%,#ffd95a 58%)}
.q{position:absolute;left:80px;right:80px;top:520px;font-family:Manrope;font-weight:800;font-size:92px;line-height:1.1;letter-spacing:-2px}
.q small{display:block;font-size:34px;letter-spacing:3px;color:#d63c63;margin-bottom:34px}
.prog{position:absolute;left:80px;width:920px;top:1755px;height:6px;background:#e1e7ef;border-radius:3px}
.prog i{display:block;height:100%;width:0;background:#d63c63;border-radius:3px}
[data-in]{opacity:0}
</style></head><body><div id="stage"><div class="grid"></div>
<div class="head"><div class="sub"><i></i>KİMYA</div><div class="brand">ucler<b>.</b></div></div>

<div class="scene" data-s="0" data-e="12.2">
 <div class="title">1 kg pamuk mu,<br><em>1 kg demir mi?</em></div>
 <svg class="v" viewBox="0 0 1080 1920">
<g data-in="0.2"><path d="M150 1150 C110 1100 130 1020 200 1015 C200 940 290 900 340 950 C380 880 480 900 490 970 C560 960 590 1040 550 1090 C600 1130 570 1200 500 1195 L190 1195 C150 1195 130 1170 150 1150 Z" fill="#fff" stroke="#1d3557" stroke-width="5"/><text x="350" y="1260" text-anchor="middle" font-size="36" font-weight="800" fill="#1d3557">1 kg pamuk</text></g><g data-in="1.8"><path d="M740 1110 L860 1110 L880 1090 L760 1090 Z" fill="#9aa6b6" stroke="#1d3557" stroke-width="5" stroke-linejoin="round"/><rect x="740" y="1110" width="120" height="70" fill="#c9d3e0" stroke="#1d3557" stroke-width="5"/><path d="M860 1110 L880 1090 V1160 L860 1180 Z" fill="#9aa6b6" stroke="#1d3557" stroke-width="5" stroke-linejoin="round"/><text x="810" y="1260" text-anchor="middle" font-size="36" font-weight="800" fill="#1d3557">1 kg demir</text></g><g data-in="5.2"><text x="350" y="1305" text-anchor="middle" font-size="30" font-weight="600" fill="#5f6f88">koca bir çuval</text></g><g data-in="8.4"><text x="810" y="1305" text-anchor="middle" font-size="30" font-weight="600" fill="#5f6f88">bir avuç</text></g><g data-in="3.9"><text x="540" y="860" text-anchor="middle" font-family="Manrope" font-size="50" font-weight="800" fill="#1d3557">ikisi de 1 kg</text></g><g data-in="10.5"><text x="540" y="1430" text-anchor="middle" font-family="Manrope" font-size="48" font-weight="800" fill="#d63c63">fark: yoğunluk</text></g>
 </svg>
</div>

<div class="scene" data-s="12.2" data-e="25.1">
 <div class="title">Yoğunluk:<br><em>kütle ÷ hacim</em></div>
 <svg class="v" viewBox="0 0 1080 1920">
<g data-in="12.4"><text x="540" y="760" text-anchor="middle" font-family="Manrope" font-size="96" font-weight="800" fill="#1d3557">d = m / V</text></g><g data-in="13.0"><path d="M180 1320 H900" stroke="#1d3557" stroke-width="4"/></g><g data-in="16.8"><rect x="230" y="910" width="140" height="410" fill="#c9d3e0" stroke="#1d3557" stroke-width="4"/><text x="300" y="1365" text-anchor="middle" font-size="32" font-weight="800" fill="#1d3557">demir</text><text x="300" y="892" text-anchor="middle" font-size="30" font-weight="700" fill="#5f6f88">7,9 g/cm³</text></g><g data-in="20.6"><rect x="470" y="1268" width="140" height="52" fill="#a8dadc" stroke="#1d3557" stroke-width="4"/><text x="540" y="1365" text-anchor="middle" font-size="32" font-weight="800" fill="#1d3557">su</text><text x="540" y="1250" text-anchor="middle" font-size="30" font-weight="700" fill="#5f6f88">1 g/cm³</text></g><g data-in="22.6"><rect x="710" y="1312" width="140" height="8" fill="#fff" stroke="#1d3557" stroke-width="4" stroke-dasharray="10 8"/><text x="780" y="1365" text-anchor="middle" font-size="32" font-weight="800" fill="#1d3557">pamuk yığını</text><text x="780" y="1294" text-anchor="middle" font-size="30" font-weight="700" fill="#5f6f88">içi hava dolu</text></g>
 </svg>
</div>

<div class="scene" data-s="25.1" data-e="34.5">
 <div class="title">Yoğunluk<br><em>maddeyi tanıtır</em></div>
 <svg class="v" viewBox="0 0 1080 1920">
<g data-in="25.4"><path d="M330 900 C360 950 380 980 380 1010 A50 50 0 0 1 280 1010 C280 980 300 950 330 900 Z" fill="#a8dadc" stroke="#1d3557" stroke-width="5"/><text x="330" y="1170" text-anchor="middle" font-size="32" font-weight="800" fill="#1d3557">bir damla su</text></g><g data-in="26.2"><path d="M640 900 H880 L860 1110 H660 Z" fill="#fff" stroke="#1d3557" stroke-width="5" stroke-linejoin="round"/><path d="M646 950 H874 L860 1110 H660 Z" fill="#a8dadc"/><text x="760" y="1170" text-anchor="middle" font-size="32" font-weight="800" fill="#1d3557">bir kova su</text></g><g data-in="27.6"><text x="330" y="1220" text-anchor="middle" font-size="32" font-weight="700" fill="#2a9d8f">d = 1 g/cm³</text><text x="760" y="1220" text-anchor="middle" font-size="32" font-weight="700" fill="#2a9d8f">d = 1 g/cm³</text></g><g data-in="32.4"><text x="540" y="1420" text-anchor="middle" font-family="Manrope" font-size="46" font-weight="800" fill="#d63c63">aynı madde, aynı yoğunluk</text></g>
 </svg>
</div>

<div class="scene" data-s="34.5" data-e="46.2">
 <div class="title">Sudan az yoğunsa<br><em>yüzer</em></div>
 <svg class="v" viewBox="0 0 1080 1920">
<g data-in="34.6"><rect x="180" y="960" width="720" height="340" fill="#a8dadc" opacity=".7"/><path d="M180 860 V1300 H900 V860" fill="none" stroke="#1d3557" stroke-width="5"/></g><g data-in="36.0"><rect x="270" y="1200" width="100" height="100" fill="#c9d3e0" stroke="#1d3557" stroke-width="5"/><text x="320" y="1180" text-anchor="middle" font-size="30" font-weight="800" fill="#1d3557">demir 7,9</text><text x="320" y="1345" text-anchor="middle" font-size="30" font-weight="700" fill="#d63c63">batar</text></g><g data-in="39.0"><rect x="640" y="948" width="150" height="150" fill="#fff" fill-opacity=".85" stroke="#1d3557" stroke-width="5"/><text x="715" y="930" text-anchor="middle" font-size="30" font-weight="800" fill="#1d3557">buz 0,92</text><text x="715" y="1345" text-anchor="middle" font-size="30" font-weight="700" fill="#2a9d8f">yüzer</text></g><g data-in="44.0"><text x="540" y="1430" text-anchor="middle" font-family="Manrope" font-size="44" font-weight="800" fill="#1d3557">buz suyun üstünde durur</text></g>
 </svg>
</div>

<div class="scene" data-s="46.2" data-e="99">
 <div class="q"><small>DÜŞÜN</small>Demirden yapılan <em>dev gemiler</em> nasıl yüzüyor?</div>
</div>

<div class="cap" id="cap"></div>
<div class="prog"><i id="bar"></i></div>
</div>
<script>
const S = 1;                 // ses hızlandırılmadı
const DUR = 50.21;           // ses süresi
const PH = [
 [0.00,1.52,"Bir kilo pamuk mu ağır,"],
 [1.77,2.75,"bir kilo demir mi?"],
 [3.12,3.61,"Cevap:"],
 [3.87,4.93,"ikisi de bir kilo."],
 [5.17,8.17,"Ama pamuğu taşımak için koca bir çuval gerekir,"],
 [8.40,10.08,"demir içinse avucun yeter."],
 [10.42,11.99,"Aradaki fark yoğunluktur."],
 [12.34,14.47,"Yoğunluk, birim hacimdeki kütledir."],
 [14.73,16.14,"Kütleyi hacme bölersin."],
 [16.35,22.23,"Demirin yoğunluğu santimetreküp başına yaklaşık yedi virgül dokuz gram, suyunki bir gramdır."],
 [22.51,24.88,"Pamuk yığınının içi ise havayla doludur."],
 [25.26,27.20,"Kütle ve hacim miktara bağlıdır."],
 [27.44,31.94,"Ama aynı sıcaklık ve basınçta saf bir maddenin yoğunluğu hep aynıdır."],
 [32.24,34.39,"Bu yüzden yoğunluk maddeyi tanıtır."],
 [34.61,35.55,"Bir de şunu belirler:"],
 [35.88,38.64,"yoğunluğu sudan küçük olan cisim suda yüzer."],
 [38.99,43.76,"Buzun yoğunluğu santimetreküp başına yaklaşık sıfır virgül dokuz iki gramdır,"],
 [43.99,45.97,"bu yüzden buz suyun üstünde durur."],
 [46.33,49.97,"Peki sence, demirden yapılan dev gemiler nasıl yüzüyor?"]
];

// kelime zamanları (parça içinde harf sayısıyla orantılı) ve altyazı grupları (en çok 24 harf)
const W = [], CH = [];
PH.forEach(([a,b,txt]) => {
  const ws = txt.split(' '), tot = ws.reduce((s,w)=>s+w.length+1,0); let acc = 0, grp = [], len = 0;
  ws.forEach(w => { const st = a + (b-a)*acc/tot; acc += w.length+1;
    if (grp.length && len + w.length + 1 > 24) { CH.push(grp); grp = []; len = 0; }
    const o = {w, t: st, c: CH.length}; W.push(o); grp.push(o); len += w.length + 1; });
  if (grp.length) CH.push(grp);
});
const ease = x => x<0?0:x>1?1:1-Math.pow(1-x,3);
const cap = document.getElementById('cap'), bar = document.getElementById('bar');
document.querySelectorAll('[data-draw] path, path[data-draw]').forEach(p => { const L = p.getTotalLength(); p.style.strokeDasharray = L; p.dataset.len = L; });
let lastC = -1;
window.render = function (tv) {
  const t = tv * S;
  document.querySelectorAll('.scene').forEach(s => {
    const a = +s.dataset.s, e = +s.dataset.e;
    s.style.opacity = Math.min(ease((t-a)/0.4), 1 - ease((t-e+0.4)/0.4));
  });
  document.querySelectorAll('[data-in]').forEach(el => {
    const k = ease((t - +el.dataset.in)/0.5), b = +(el.dataset.base||0), o = el.dataset.out ? 1 - ease((t - +el.dataset.out)/0.4) : 1;
    el.style.opacity = (b + (1-b)*k) * o; el.style.transform = el.getAttribute('transform') ? '' : `translateY(${(1-k)*24}px)`;
  });
  document.querySelectorAll('[data-draw]').forEach(g => {
    const k = ease((t - +g.dataset.draw)/ +g.dataset.dur);
    (g.tagName==='path'?[g]:g.querySelectorAll('path')).forEach(p => p.style.strokeDashoffset = p.dataset.len*(1-k));
  });
  // altyazı
  let i = W.findIndex(o => o.t > t); i = (i === -1 ? W.length : i) - 1; if (i < 0) i = 0;
  const cur = W[i];
  if (cur.c !== lastC) { cap.innerHTML = CH[cur.c].map(o => `<span>${o.w}</span>`).join(''); lastC = cur.c; cap.style.fontSize='50px';
    if (cap.scrollWidth > 880) cap.style.fontSize = Math.floor(50*880/cap.scrollWidth)+'px'; }
  [...cap.children].forEach((s, j) => s.className = CH[cur.c][j] === cur ? 'on' : '');
  bar.style.width = Math.min(100, t/DUR*100) + '%';
};
render(0);
</script></body></html>
