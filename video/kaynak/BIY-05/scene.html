<div class="scene" data-s="81.73" data-e="99">
 <div class="q"><small>DÜŞÜN</small>Pişmiş bir yumurtayı soğutsan neden yeniden <em>çiğ</em> yumurtaya dönmez?</div>
</div>

<div class="cap" id="cap"></div>
<div class="prog"><i id="bar"></i></div>
</div>
<script>
const S = 1;                 // ses hızlandırılmadı
const DUR = 86.99;           // ses süresi
const PH = [
 [0.00,1.37,"Bin dokuz yüz elli beş."],
 [1.75,4.18,"İngiliz biyokimyacı Frederick Sanger,"],
 [4.39,6.06,"on yıllık bir çalışmayı bitiriyor."],
 [6.42,11.33,"İnsülin proteinini oluşturan elli bir yapı taşını tek tek, sırasıyla okuyor."],
 [11.63,13.85,"Bu, dizisi çözülen ilk protein."],
 [14.11,16.53,"Sanger bu çalışmayla Nobel Ödülü alıyor."],
 [16.99,19.53,"Proteinin yapı taşlarına amino asit denir."],
 [19.83,22.45,"Canlılarda yirmi çeşit amino asit vardır."],
 [22.72,25.39,"Bunları bir alfabenin harfleri gibi düşünebilirsin."],
 [25.64,30.73,"İki amino asit birleşirken aralarından bir su molekülü çıkar ve peptit bağı kurulur."],
 [31.11,32.63,"Harfler yan yana dizilir,"],
 [32.87,34.19,"uzun bir zincir oluşur."],
 [34.50,36.55,"Yirmi harfle kaç kelime yazılabilir?"],
 [36.92,43.07,"Yüz amino asitlik bir zincir için olası dizilerin sayısı, evrendeki atomların sayısından fazladır."],
 [43.35,49.31,"Bu yüzden enzimden kas lifine, antikordan hormona kadar binlerce farklı protein vardır."],
 [49.64,51.18,"Ama zincir düz kalmaz."],
 [51.39,52.04,"Katlanır,"],
 [52.24,54.52,"kıvrılır ve üç boyutlu bir şekil alır."],
 [54.92,56.96,"Amino asit sırası şekli belirler,"],
 [57.31,58.24,"şekil de görevi."],
 [58.50,60.07,"Tek bir harf bile önemlidir."],
 [60.41,63.92,"Hemoglobinin bir zincirinde yüz kırk altı amino asit vardır."],
 [64.21,70.68,"Altıncı sıradaki tek bir amino asit değişirse, molekül yapışkanlaşır ve alyuvarlar orak gibi bükülür."],
 [71.04,72.92,"Buna orak hücre anemisi denir."],
 [73.29,75.31,"Şekil bozulursa görev de biter."],
 [75.70,79.61,"Yüksek sıcaklık ya da asit, proteinin katlanmış şeklini açar."],
 [79.88,81.40,"Buna denatürasyon denir."],
 [81.73,86.99,"Peki sence, pişmiş bir yumurtayı soğutsan neden yeniden çiğ yumurtaya dönmez?"]
];

// kelime zamanları (parça içinde harf sayısıyla orantılı) ve altyazı grupları (en çok 24 harf)
const W = [], CH = [];
PH.forEach(([a,b,txt]) => {
  const ws = txt.split(' '), tot = ws.reduce((s,w)=>s+w.length+1,0); let acc = 0, grp = [], len = 0;
  ws.forEach(w => { const st = a + (b-a)*acc/tot; acc += w.length+1;
    if (grp.length && len + w.length + 1 > 24) { CH.push(grp); grp = []; len = 0; }
    const o = {w, t: st, c: CH.length}; W.push(o); grp.push(o); len += w.length + 1; });
  if (grp.length) CH.push(grp);
});
const ease = x => x<0?0:x>1?1:1-Math.pow(1-x,3);
const cap = document.getElementById('cap'), bar = document.getElementById('bar');
document.querySelectorAll('[data-draw] path, path[data-draw]').forEach(p => { const L = p.getTotalLength(); p.style.strokeDasharray = L; p.dataset.len = L; });
let lastC = -1;
window.render = function (tv) {
  const t = tv * S;
  document.querySelectorAll('.scene').forEach(s => {
    const a = +s.dataset.s, e = +s.dataset.e;
    s.style.opacity = Math.min(ease((t-a)/0.4), 1 - ease((t-e+0.4)/0.4));
  });
  document.querySelectorAll('[data-in]').forEach(el => {
    const k = ease((t - +el.dataset.in)/0.5), b = +(el.dataset.base||0), o = el.dataset.out ? 1 - ease((t - +el.dataset.out)/0.4) : 1;
    el.style.opacity = (b + (1-b)*k) * o; el.style.transform = el.getAttribute('transform') ? '' : `translateY(${(1-k)*24}px)`;
  });
  document.querySelectorAll('[data-draw]').forEach(g => {
    const k = ease((t - +g.dataset.draw)/ +g.dataset.dur);
    (g.tagName==='path'?[g]:g.querySelectorAll('path')).forEach(p => p.style.strokeDashoffset = p.dataset.len*(1-k));
  });
  // altyazı
  let i = W.findIndex(o => o.t > t); i = (i === -1 ? W.length : i) - 1; if (i < 0) i = 0;
  const cur = W[i];
  if (cur.c !== lastC) { cap.innerHTML = CH[cur.c].map(o => `<span>${o.w}</span>`).join(''); lastC = cur.c; cap.style.fontSize='50px';
    if (cap.scrollWidth > 880) cap.style.fontSize = Math.floor(50*880/cap.scrollWidth)+'px'; }
  [...cap.children].forEach((s, j) => s.className = CH[cur.c][j] === cur ? 'on' : '');
  bar.style.width = Math.min(100, t/DUR*100) + '%';
};
render(0);
</script></body></html>
