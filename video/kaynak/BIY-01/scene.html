<div class="scene" data-s="90.05" data-e="99">
 <div class="q"><small>DÜŞÜN</small>Bir şeye canlı demek için <em>hangi özellik</em> şart?</div>
</div>

<div class="cap" id="cap"></div>
<div class="prog"><i id="bar"></i></div>
</div>
<script>
const S = 1;                 // ses hızlandırılmadı
const DUR = 93.88;           // ses süresi
const PH = [
 [0.00,1.45,"Bin sekiz yüz doksan iki."],
 [1.92,7.69,"Rus bilim insanı Dimitri İvanovski, tütün yapraklarında lekeler yapan bir hastalığı araştırıyor."],
 [7.98,13.41,"Hasta yaprağın özsuyunu, bakterileri tutan çok ince bir porselen süzgeçten geçiriyor."],
 [13.79,15.75,"Süzülen sıvıda hiç bakteri yok."],
 [16.01,19.94,"Ama bu sıvıyı sağlıklı bir yaprağa sürünce, yaprak yine hastalanıyor."],
 [20.23,23.72,"Demek ki hastalığı yapan şey, bakteriden çok daha küçük."],
 [24.02,31.08,"Birkaç yıl sonra Hollandalı Martinus Beijerinck aynı deneyi tekrarlıyor ve bu etkene bulaşıcı canlı sıvı diyor."],
 [31.54,35.52,"Bin dokuz yüz otuz beşte ise Wendell Stanley virüsü saflaştırıyor."],
 [35.82,37.68,"Elinde kalan şey onu şaşırtıyor:"],
 [37.98,39.94,"tuza benzeyen küçük kristaller."],
 [40.27,43.84,"Bir canlı, kristal hâline getirilip şişede saklanabilir mi?"],
 [44.16,45.61,"Virüs bir hücre değildir."],
 [45.85,50.06,"Protein bir kılıfın içinde yalnızca DNA ya da RNA taşır."],
 [50.37,55.35,"Beslenmez, enerji üretmez, uyarılara tepki vermez, tek başına çoğalamaz."],
 [55.60,59.56,"Şişedeki kristaller yıllarca hiçbir şey yapmadan bekleyebilir."],
 [59.84,65.13,"Ama o kristalleri suda çözüp bir tütün yaprağına sürersen, virüs yeniden hücrelere girer."],
 [65.45,69.67,"Hücrenin düzeneğini ele geçirir ve ona binlerce yeni kopyasını yaptırır."],
 [69.99,71.53,"Kopyalanırken hatalar olur,"],
 [71.89,73.70,"yani virüs mutasyona uğrar."],
 [74.00,77.02,"Grip aşısının her yıl yenilenmesinin bir nedeni de budur:"],
 [77.36,78.72,"virüs sürekli değişir."],
 [78.97,80.94,"Yani virüsün kalıtım maddesi var,"],
 [81.27,82.71,"çoğalıyor ve değişiyor."],
 [83.02,86.07,"Ama bunların hiçbirini bir hücre olmadan yapamıyor."],
 [86.38,89.68,"Bu yüzden virüsler, canlı ile cansızın sınırında sayılır."],
 [90.05,93.88,"Peki sence, bir şeye canlı demek için hangi özellik şart?"]
];

// kelime zamanları (parça içinde harf sayısıyla orantılı) ve altyazı grupları (en çok 24 harf)
const W = [], CH = [];
PH.forEach(([a,b,txt]) => {
  const ws = txt.split(' '), tot = ws.reduce((s,w)=>s+w.length+1,0); let acc = 0, grp = [], len = 0;
  ws.forEach(w => { const st = a + (b-a)*acc/tot; acc += w.length+1;
    if (grp.length && len + w.length + 1 > 24) { CH.push(grp); grp = []; len = 0; }
    const o = {w, t: st, c: CH.length}; W.push(o); grp.push(o); len += w.length + 1; });
  if (grp.length) CH.push(grp);
});
const ease = x => x<0?0:x>1?1:1-Math.pow(1-x,3);
const cap = document.getElementById('cap'), bar = document.getElementById('bar');
document.querySelectorAll('[data-draw] path, path[data-draw]').forEach(p => { const L = p.getTotalLength(); p.style.strokeDasharray = L; p.dataset.len = L; });
let lastC = -1;
window.render = function (tv) {
  const t = tv * S;
  document.querySelectorAll('.scene').forEach(s => {
    const a = +s.dataset.s, e = +s.dataset.e;
    s.style.opacity = Math.min(ease((t-a)/0.4), 1 - ease((t-e+0.4)/0.4));
  });
  document.querySelectorAll('[data-in]').forEach(el => {
    const k = ease((t - +el.dataset.in)/0.5), b = +(el.dataset.base||0), o = el.dataset.out ? 1 - ease((t - +el.dataset.out)/0.4) : 1;
    el.style.opacity = (b + (1-b)*k) * o; el.style.transform = el.getAttribute('transform') ? '' : `translateY(${(1-k)*24}px)`;
  });
  document.querySelectorAll('[data-draw]').forEach(g => {
    const k = ease((t - +g.dataset.draw)/ +g.dataset.dur);
    (g.tagName==='path'?[g]:g.querySelectorAll('path')).forEach(p => p.style.strokeDashoffset = p.dataset.len*(1-k));
  });
  // altyazı
  let i = W.findIndex(o => o.t > t); i = (i === -1 ? W.length : i) - 1; if (i < 0) i = 0;
  const cur = W[i];
  if (cur.c !== lastC) { cap.innerHTML = CH[cur.c].map(o => `<span>${o.w}</span>`).join(''); lastC = cur.c; cap.style.fontSize='50px';
    if (cap.scrollWidth > 880) cap.style.fontSize = Math.floor(50*880/cap.scrollWidth)+'px'; }
  [...cap.children].forEach((s, j) => s.className = CH[cur.c][j] === cur ? 'on' : '');
  bar.style.width = Math.min(100, t/DUR*100) + '%';
};
render(0);
</script></body></html>
