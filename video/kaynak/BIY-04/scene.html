<div class="scene" data-s="86.28" data-e="99">
 <div class="q"><small>DÜŞÜN</small>Rüzgârla taşınan küçük tohumlar enerjiyi <em>nişasta</em> mı, <em>yağ</em> olarak mı depolamalı?</div>
</div>

<div class="cap" id="cap"></div>
<div class="prog"><i id="bar"></i></div>
</div>
<script>
const S = 1;                 // ses hızlandırılmadı
const DUR = 93.47;           // ses süresi
const PH = [
 [0.00,4.21,"Yakut boğazlı sinekkuşu, yalnızca üç gram ağırlığında bir kuş."],
 [4.45,6.82,"Her sonbahar Meksika Körfezi'ni geçer."],
 [7.04,8.83,"Yaklaşık sekiz yüz kilometre,"],
 [9.11,9.90,"hiç konmadan,"],
 [10.15,11.90,"gece gündüz kanat çırparak."],
 [12.17,18.29,"Yola çıkmadan önce birkaç hafta boyunca durmadan nektar içer ve ağırlığını neredeyse ikiye katlar."],
 [18.62,21.15,"Ama içtiği şekeri şeker olarak saklamaz."],
 [21.42,22.48,"Onu yağa çevirir."],
 [22.81,23.19,"Neden?"],
 [23.44,27.23,"Çünkü bir gram yağ yaklaşık dokuz kilokalori enerji verir."],
 [27.47,30.33,"Bir gram şeker ya da nişasta ise yaklaşık dört."],
 [30.73,33.97,"Yağ, gram başına iki kattan fazla enerji taşır."],
 [34.29,36.34,"Farkın sırrı moleküllerin içinde."],
 [36.62,43.21,"Hücrende enerji, karbon ve hidrojenin oksijenle birleşip karbondioksit ve suya dönüşmesiyle açığa çıkar."],
 [43.52,46.32,"Glikoz molekülünde zaten çok oksijen vardır."],
 [46.54,49.62,"Yani glikoz, bir anlamda yarı yolda bir yakıttır."],
 [49.87,53.35,"Yağ asidi ise uzun bir karbon ve hidrojen zinciridir,"],
 [53.60,55.59,"neredeyse hiç oksijen içermez."],
 [55.82,58.76,"Oksijenle birleşecek çok daha fazla atomu vardır."],
 [59.04,60.34,"Bir de su meselesi var."],
 [60.65,63.04,"Vücudun şekeri glikojen olarak saklar."],
 [63.38,66.39,"Her gram glikojen yanında birkaç gram su tutar."],
 [66.70,68.41,"Yağ ise suda çözünmez,"],
 [68.63,70.11,"kuru ve sıkı paketlenir."],
 [70.41,74.96,"Aynı enerjiyi glikojen olarak taşısaydın, deposu birkaç kat ağır olurdu."],
 [75.23,77.50,"Sinekkuşu için her gram önemlidir."],
 [77.71,80.51,"Bu yüzden uzun yolculuğun yakıtı yağdır."],
 [80.74,86.02,"Senin vücudun da hızlı enerji için glikojeni, uzun süreli depo için yağı kullanır."],
 [86.28,89.74,"Peki sence, rüzgârla uzaklara taşınan küçük tohumlar"],
 [89.94,93.47,"enerjiyi nişasta olarak mı, yağ olarak mı depolamalı?"]
];

// kelime zamanları (parça içinde harf sayısıyla orantılı) ve altyazı grupları (en çok 24 harf)
const W = [], CH = [];
PH.forEach(([a,b,txt]) => {
  const ws = txt.split(' '), tot = ws.reduce((s,w)=>s+w.length+1,0); let acc = 0, grp = [], len = 0;
  ws.forEach(w => { const st = a + (b-a)*acc/tot; acc += w.length+1;
    if (grp.length && len + w.length + 1 > 24) { CH.push(grp); grp = []; len = 0; }
    const o = {w, t: st, c: CH.length}; W.push(o); grp.push(o); len += w.length + 1; });
  if (grp.length) CH.push(grp);
});
const ease = x => x<0?0:x>1?1:1-Math.pow(1-x,3);
const cap = document.getElementById('cap'), bar = document.getElementById('bar');
document.querySelectorAll('[data-draw] path, path[data-draw]').forEach(p => { const L = p.getTotalLength(); p.style.strokeDasharray = L; p.dataset.len = L; });
let lastC = -1;
window.render = function (tv) {
  const t = tv * S;
  document.querySelectorAll('.scene').forEach(s => {
    const a = +s.dataset.s, e = +s.dataset.e;
    s.style.opacity = Math.min(ease((t-a)/0.4), 1 - ease((t-e+0.4)/0.4));
  });
  document.querySelectorAll('[data-in]').forEach(el => {
    const k = ease((t - +el.dataset.in)/0.5), b = +(el.dataset.base||0), o = el.dataset.out ? 1 - ease((t - +el.dataset.out)/0.4) : 1;
    el.style.opacity = (b + (1-b)*k) * o; el.style.transform = el.getAttribute('transform') ? '' : `translateY(${(1-k)*24}px)`;
  });
  document.querySelectorAll('[data-draw]').forEach(g => {
    const k = ease((t - +g.dataset.draw)/ +g.dataset.dur);
    (g.tagName==='path'?[g]:g.querySelectorAll('path')).forEach(p => p.style.strokeDashoffset = p.dataset.len*(1-k));
  });
  // altyazı
  let i = W.findIndex(o => o.t > t); i = (i === -1 ? W.length : i) - 1; if (i < 0) i = 0;
  const cur = W[i];
  if (cur.c !== lastC) { cap.innerHTML = CH[cur.c].map(o => `<span>${o.w}</span>`).join(''); lastC = cur.c; cap.style.fontSize='50px';
    if (cap.scrollWidth > 880) cap.style.fontSize = Math.floor(50*880/cap.scrollWidth)+'px'; }
  [...cap.children].forEach((s, j) => s.className = CH[cur.c][j] === cur ? 'on' : '');
  bar.style.width = Math.min(100, t/DUR*100) + '%';
};
render(0);
</script></body></html>
