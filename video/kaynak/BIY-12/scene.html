<div class="prog"><i id="bar"></i></div>
</div>
<script>
const S = 1;                 // ses hızlandırılmadı
const DUR = 82.4;           // ses süresi
const PH = [
 [0.00,2.67,"Vücudunda trilyonlarca bakteri yaşıyor."],
 [2.92,5.43,"Bağırsağında, derinde, ağzında."],
 [5.70,9.18,"Sayıları, senin kendi hücrelerinle aşağı yukarı aynıdır."],
 [9.52,13.47,"Ama bir bakteri hücresi, senin hücrenden çok farklı kurulmuştur."],
 [13.83,15.62,"Bakteri bir prokaryottur."],
 [15.91,18.41,"Prokaryot, çekirdekten önce demektir."],
 [18.70,21.28,"Bakterinin zarla çevrili bir çekirdeği yoktur."],
 [21.63,25.99,"DNA'sı sitoplazmanın içinde, çekirdek bölgesi denen yerde durur."],
 [26.35,31.60,"Mitokondri, Golgi ya da endoplazmik retikulum gibi zarlı organelleri de yoktur."],
 [32.01,34.13,"Senin hücren ise bir ökaryottur."],
 [34.43,37.28,"DNA'n, çift zarlı bir çekirdeğin içinde korunur."],
 [37.61,40.39,"Hücrenin içi zarlarla bölmelere ayrılmıştır;"],
 [40.65,42.44,"her organel kendi işini yapar."],
 [42.77,44.30,"Peki ortak noktaları ne?"],
 [44.55,49.20,"İkisinde de hücre zarı, sitoplazma, ribozom ve DNA vardır."],
 [49.45,52.65,"Yani ikisi de kendi proteinini üretir ve çoğalır."],
 [53.00,53.85,"Bir fark daha var."],
 [54.14,58.16,"Bakterilerin çoğunda, zarın dışında sağlam bir hücre duvarı bulunur."],
 [58.48,62.25,"Bu duvar, senin hücrelerinde olmayan özel bir maddeden yapılır."],
 [62.59,63.53,"Boyut da farklıdır:"],
 [63.87,67.43,"tipik bir bakteri, senin hücrenden on kat kadar küçüktür."],
 [67.80,69.64,"Bu farklar tıpta çok işe yarar."],
 [69.96,73.13,"Penisilin, bakterinin hücre duvarını kurmasını engeller."],
 [73.43,75.35,"Duvarı zayıflayan bakteri patlar."],
 [75.73,80.12,"Peki sence, penisilin neden senin hücrelerine aynı zararı vermez?"]
];

// kelime zamanları (parça içinde harf sayısıyla orantılı) ve altyazı grupları (en çok 24 harf)
const W = [], CH = [];
PH.forEach(([a,b,txt]) => {
  const ws = txt.split(' '), tot = ws.reduce((s,w)=>s+w.length+1,0); let acc = 0, grp = [], len = 0;
  ws.forEach(w => { const st = a + (b-a)*acc/tot; acc += w.length+1;
    if (grp.length && len + w.length + 1 > 24) { CH.push(grp); grp = []; len = 0; }
    const o = {w, t: st, c: CH.length}; W.push(o); grp.push(o); len += w.length + 1; });
  if (grp.length) CH.push(grp);
});
const ease = x => x<0?0:x>1?1:1-Math.pow(1-x,3);
const cap = document.getElementById('cap'), bar = document.getElementById('bar');
document.querySelectorAll('[data-draw] path, path[data-draw]').forEach(p => { const L = p.getTotalLength(); p.style.strokeDasharray = L; p.dataset.len = L; });
let lastC = -1;
window.render = function (tv) {
  const t = tv * S;
  document.querySelectorAll('.scene').forEach(s => {
    const a = +s.dataset.s, e = +s.dataset.e;
    s.style.opacity = Math.min(ease((t-a)/0.4), 1 - ease((t-e+0.4)/0.4));
  });
  document.querySelectorAll('[data-in]').forEach(el => {
    const k = ease((t - +el.dataset.in)/0.5), b = +(el.dataset.base||0), o = el.dataset.out ? 1 - ease((t - +el.dataset.out)/0.4) : 1;
    el.style.opacity = (b + (1-b)*k) * o; el.style.transform = el.getAttribute('transform') ? '' : `translateY(${(1-k)*24}px)`;
  });
  document.querySelectorAll('[data-draw]').forEach(g => {
    const k = ease((t - +g.dataset.draw)/ +g.dataset.dur);
    (g.tagName==='path'?[g]:g.querySelectorAll('path')).forEach(p => p.style.strokeDashoffset = p.dataset.len*(1-k));
  });
  // altyazı
  let i = W.findIndex(o => o.t > t); i = (i === -1 ? W.length : i) - 1; if (i < 0) i = 0;
  const cur = W[i];
  if (cur.c !== lastC) { cap.innerHTML = CH[cur.c].map(o => `<span>${o.w}</span>`).join(''); lastC = cur.c; cap.style.fontSize='50px';
    if (cap.scrollWidth > 880) cap.style.fontSize = Math.floor(50*880/cap.scrollWidth)+'px'; }
  [...cap.children].forEach((s, j) => s.className = CH[cur.c][j] === cur ? 'on' : '');
  cap.style.opacity = t > 80.05 ? 0 : 1;
  bar.style.width = Math.min(100, t/DUR*100) + '%';
};
render(0);
</script></body></html>
