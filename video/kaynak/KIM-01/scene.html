<!doctype html>

<style>

.head .brand{letter-spacing:-0.5px;font-size:38px;color:#1d3557}
.head .brand b{color:#d63c63}

.title{position:absolute;left:80px;right:80px;top:195px;font-family:Manrope;font-weight:800;font-size:78px;line-height:1.08;letter-spacing:-1.5px}

svg.v{position:absolute;left:0;top:0;width:1080px;height:1920px;transform:translateY(100px) scale(1.08);transform-origin:540px 960px}
svg text{font-family:Inter;font-weight:600}
.cap{position:absolute;left:80px;width:920px;top:1610px;height:110px;background:#fff;border:2px solid #dbe3ee;border-radius:18px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:50px;box-shadow:0 8px 24px rgba(29,53,87,.08);white-space:nowrap;overflow:hidden}

.q{position:absolute;left:80px;right:80px;top:520px;font-family:Manrope;font-weight:800;font-size:92px;line-height:1.1;letter-spacing:-2px}
.q small{display:block;font-size:34px;letter-spacing:3px;color:#d63c63;margin-bottom:34px}
.prog{position:absolute;left:80px;width:920px;top:1755px;height:6px;background:#e1e7ef;border-radius:3px}
.prog i{display:block;height:100%;width:0;background:#d63c63;border-radius:3px}
[data-in]{opacity:0}

<!-- 6. Düşün -->
<div class="scene" data-s="59.0" data-e="99">
 <div class="q"><small>DÜŞÜN</small>Hiç gerçekleşmeyen bir hayal, bilime nasıl bu kadar çok şey <em>kazandırmış</em> olabilir?</div>
</div>

<div class="cap" id="cap"></div>
<div class="prog"><i id="bar"></i></div>
</div>
<script>
const S = 1.08;              // ses 1,08 kat hızlandırıldı (64,8 sn -> 60 sn)
const DUR = 64.76;           // asıl ses süresi
// Konuşma parçaları: [başlangıç, bitiş, metin] (asıl ses zamanı, sessizlik tespitinden)
const PH = [
 [0.00,1.12,"Dokuzuncu yüzyıl,"],[1.41,1.95,"Bağdat."],
 [2.34,6.15,"Loş bir odada bir simyacı, eritilmiş kurşunun başında bekliyor."],
 [6.48,7.40,"Tek bir hayali var:"],[7.81,10.44,"bu gri, ucuz metali altına çevirmek."],
 [10.87,12.88,"Simya, kimyadan önceki adımdı."],[13.14,15.42,"Çin'den Hindistan'a pek çok yerde vardı."],
 [15.69,17.87,"Batı'daki kolu İskenderiye'de doğdu,"],[18.07,21.25,"İslam dünyasında gelişti, oradan Avrupa'ya yayıldı."],
 [21.56,23.21,"Simyacılar iki şey arıyordu."],[23.47,27.34,"Biri, metalleri altına çevireceğine inandıkları felsefe"],[27.58,28.10,"taşıydı."],
 [28.30,29.96,"Diğeri, ömrü uzatacak hayat iksiri."],[30.27,31.81,"İkisini de hiç bulamadılar."],[32.26,32.60,"Neden?"],
 [32.92,37.35,"Çünkü bir elementi belirleyen şey, atomunun çekirdeğindeki proton sayısıdır."],
 [37.74,40.90,"Kurşunda seksen iki proton var, altında yetmiş dokuz."],
 [41.25,43.55,"Kimyasal tepkimeler çekirdeğe dokunmaz,"],[43.76,45.79,"atomları sadece yeniden düzenler."],
 [46.11,50.09,"Yani hiçbir karışım, hiçbir ateş kurşunu altına çeviremez."],
 [50.39,52.16,"Simyacılar hedefe ulaşamadı."],[52.40,54.39,"Ama denerken kurdukları ocaklar,"],
 [54.61,58.76,"cam kaplar ve yöntemler, bugünkü kimya laboratuvarının temeli oldu."],
 [59.05,59.82,"Peki sence,"],[60.03,64.70,"hiç gerçekleşmeyen bir hayal, bilime nasıl bu kadar çok şey kazandırmış olabilir?"]
];
// kelime zamanları (parça içinde harf sayısıyla orantılı) ve altyazı grupları (en çok 24 harf)
const W = [], CH = [];
PH.forEach(([a,b,txt]) => {
  const ws = txt.split(' '), tot = ws.reduce((s,w)=>s+w.length+1,0); let acc = 0, grp = [], len = 0;
  ws.forEach(w => { const st = a + (b-a)*acc/tot; acc += w.length+1;
    if (grp.length && len + w.length + 1 > 24) { CH.push(grp); grp = []; len = 0; }
    const o = {w, t: st, c: CH.length}; W.push(o); grp.push(o); len += w.length + 1; });
  if (grp.length) CH.push(grp);
});
const ease = x => x<0?0:x>1?1:1-Math.pow(1-x,3);
const cap = document.getElementById('cap'), bar = document.getElementById('bar');
document.querySelectorAll('[data-draw] path, path[data-draw]').forEach(p => { const L = p.getTotalLength(); p.style.strokeDasharray = L; p.dataset.len = L; });
let lastC = -1;
window.render = function (tv) {
  const t = tv * S;
  document.querySelectorAll('.scene').forEach(s => {
    const a = +s.dataset.s, e = +s.dataset.e;
    s.style.opacity = Math.min(ease((t-a)/0.4), 1 - ease((t-e+0.4)/0.4));
  });
  document.querySelectorAll('[data-in]').forEach(el => {
    const k = ease((t - +el.dataset.in)/0.5), b = +(el.dataset.base||0);
    el.style.opacity = b + (1-b)*k; el.style.transform = el.getAttribute('transform') ? '' : `translateY(${(1-k)*24}px)`;
  });
  document.querySelectorAll('[data-draw]').forEach(g => {
    const k = ease((t - +g.dataset.draw)/ +g.dataset.dur);
    (g.tagName==='path'?[g]:g.querySelectorAll('path')).forEach(p => p.style.strokeDashoffset = p.dataset.len*(1-k));
  });
  // ateş ve buhar
  const fire = document.getElementById('fire'); fire.setAttribute('transform', `scale(1 ${1+0.12*Math.sin(t*9)})`); fire.style.transformOrigin='0 175px';
  document.getElementById('steam').setAttribute('transform', `translate(${6*Math.sin(t*2)} ${-8*((t*0.8)%1)})`);
  // başlık 4: "Neden?" sonrası
  const k4 = ease((t-32.6)/0.4); document.getElementById('t4a').style.opacity = 1-k4; document.getElementById('t4b').style.opacity = k4;
  // elektronlar döner, tepkime anında karışır; çekirdek sabit
  const elec = (id, cx, ph) => { const g = document.getElementById(id); let h=''; const sp = (t>41.2 && t<46)?1.6:0.35;
    [[90,1],[150,2],[210,2]].forEach(([r,n],i)=>{ for(let j=0;j<n;j++){ const an = ph + t*sp*(i%2?-1:1) + j*Math.PI + i; h += `<circle cx="${cx+r*Math.cos(an)}" cy="${930+r*Math.sin(an)}" r="9"/>`; }});
    g.innerHTML = h; };
  elec('eL',290,0); elec('eR',790,1);
  // altyazı
  let i = W.findIndex(o => o.t > t); i = (i === -1 ? W.length : i) - 1; if (i < 0) i = 0;
  const cur = W[i];
  if (cur.c !== lastC) { cap.innerHTML = CH[cur.c].map(o => `<span>${o.w}</span>`).join(''); lastC = cur.c; cap.style.fontSize='50px';
    if (cap.scrollWidth > 880) cap.style.fontSize = Math.floor(50*880/cap.scrollWidth)+'px'; }
  [...cap.children].forEach((s, j) => s.className = CH[cur.c][j] === cur ? 'on' : '');
  bar.style.width = Math.min(100, t/DUR*100) + '%';
};
render(0);
</script></body></html>
