<script>
const S = 1;
const DUR = 76.2;           // ses süresi
const PH = [
 [0.00,1.28,"İki temizlik ürünü,"],
 [1.50,2.55,"bir zehirli gaz."],
 [2.97,7.77,"Banyoda kir inatçı olunca birçok kişi çamaşır suyunun üstüne tuz ruhu döker."],
 [8.05,9.56,"Daha güçlü temizleyeceğini sanır."],
 [9.85,12.67,"Oysa o anda tehlikeli bir tepkime başlar."],
 [13.06,16.40,"Çamaşır suyundaki etken madde sodyum hipoklorittir."],
 [16.69,17.62,"Tuz ruhu ise"],
 [17.83,18.96,"hidroklorik asittir."],
 [19.25,21.86,"İkisi karşılaşınca klor gazı açığa çıkar."],
 [22.19,25.74,"Klor, sarımsı yeşil renkli ve keskin kokulu bir gazdır."],
 [26.03,28.63,"Havadan ağır olduğu için yere yakın birikir."],
 [28.83,33.63,"Birinci Dünya Savaşı'nda kimyasal silah olarak kullanılan ilk gazlardan biridir."],
 [34.01,39.50,"Klor gazını soluduğunda gaz, akciğerindeki nemle tepkimeye girer ve asitler oluşturur."],
 [39.79,40.69,"Gözlerin yanar,"],
 [40.93,46.62,"öksürürsün ve nefes almakta zorlanırsın. Küçük ve kapalı bir banyoda bu çok hızlı olur."],
 [46.96,52.09,"Tehlike yalnızca tuz ruhunda değildir. Asitli kireç sökücüler de aynı gazı çıkarır."],
 [52.40,57.25,"Çamaşır suyu amonyaklı bir temizleyiciyle karışırsa da zehirli kloramin oluşur."],
 [57.61,58.23,"Kural basit:"],
 [58.58,61.74,"Çamaşır suyunu hiçbir temizlik ürünüyle karıştırma."],
 [61.95,68.30,"Keskin bir koku fark edersen hemen ortamdan çık, camları aç ve 114'ü, yani Zehir Danışma Merkezi'ni ara."],
 [68.40,69.31,"Peki sence,"],
 [69.59,70.35,"havuz"],
 [70.58,71.89,"suyunda da klor var;"],
 [72.18,73.74,"havuzda neden zehirlenmeyiz?"]
];

// kelime zamanları (parça içinde harf sayısıyla orantılı) ve altyazı grupları (en çok 24 harf)
const W = [], CH = [];
PH.forEach(([a,b,txt]) => {
  const ws = txt.split(' '), tot = ws.reduce((s,w)=>s+w.length+1,0); let acc = 0, grp = [], len = 0;
  ws.forEach(w => { const st = a + (b-a)*acc/tot; acc += w.length+1;
    if (grp.length && len + w.length + 1 > 24) { CH.push(grp); grp = []; len = 0; }
    const o = {w, t: st, c: CH.length}; W.push(o); grp.push(o); len += w.length + 1; });
  if (grp.length) CH.push(grp);
});
const ease = x => x<0?0:x>1?1:1-Math.pow(1-x,3);
const cap = document.getElementById('cap'), bar = document.getElementById('bar');
document.querySelectorAll('[data-draw] path, path[data-draw]').forEach(p => { const L = p.getTotalLength(); p.style.strokeDasharray = L; p.dataset.len = L; });
let lastC = -1;
window.render = function (tv) {
  const t = tv * S;
  document.querySelectorAll('.scene').forEach(s => {
    const a = +s.dataset.s, e = +s.dataset.e;
    s.style.opacity = Math.min(ease((t-a)/0.4), 1 - ease((t-e+0.4)/0.4));
  });
  document.querySelectorAll('[data-in]').forEach(el => {
    const k = ease((t - +el.dataset.in)/0.5), b = +(el.dataset.base||0), o = el.dataset.out ? 1 - ease((t - +el.dataset.out)/0.4) : 1;
    el.style.opacity = (b + (1-b)*k) * o; el.style.transform = el.getAttribute('transform') ? '' : `translateY(${(1-k)*24}px)`;
  });
  document.querySelectorAll('[data-draw]').forEach(g => {
    const k = ease((t - +g.dataset.draw)/ +g.dataset.dur);
    (g.tagName==='path'?[g]:g.querySelectorAll('path')).forEach(p => p.style.strokeDashoffset = p.dataset.len*(1-k));
  });
  // altyazı
  let i = W.findIndex(o => o.t > t); i = (i === -1 ? W.length : i) - 1; if (i < 0) i = 0;
  const cur = W[i];
  if (cur.c !== lastC) { cap.innerHTML = CH[cur.c].map(o => `<span>${o.w}</span>`).join(''); lastC = cur.c; cap.style.fontSize='50px';
    if (cap.scrollWidth > 880) cap.style.fontSize = Math.floor(50*880/cap.scrollWidth)+'px'; }
  [...cap.children].forEach((s, j) => s.className = CH[cur.c][j] === cur ? 'on' : '');
  cap.style.opacity = t > 74.0 ? 0 : 1;
  bar.style.width = Math.min(100, t/DUR*100) + '%';
};
render(0);
</script></body></html>
