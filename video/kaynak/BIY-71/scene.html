 <svg class="v" viewBox="0 0 1080 1920">
<g data-in="-1"><rect x="80" y="500" width="920" height="740" rx="18" fill="#fff" stroke="#1fa463" stroke-width="5"/><text x="140" y="590" font-size="32" font-weight="800" fill="#1fa463">ÖZET</text><circle cx="160" cy="680" r="14" fill="#1fa463"/><text x="200" y="694" font-size="40" font-weight="800" fill="#1d3557">CO renksiz, kokusuz:</text><text x="200" y="744" font-size="40" font-weight="800" fill="#1fa463">eksik yanmadan çıkar</text><circle cx="160" cy="840" r="14" fill="#1fa463"/><text x="200" y="854" font-size="40" font-weight="800" fill="#1d3557">Hemoglobine O₂'den</text><text x="200" y="904" font-size="40" font-weight="800" fill="#1fa463">≈ 200 kat sıkı bağlanır</text><circle cx="160" cy="1000" r="14" fill="#1fa463"/><text x="200" y="1014" font-size="40" font-weight="800" fill="#1d3557">Belirti varsa:</text><text x="200" y="1064" font-size="40" font-weight="800" fill="#1fa463">camı aç, temiz hava, 112</text><path d="M140 1110 H940" stroke="#dbe3ee" stroke-width="3"/><path d="M160 1140 h40 v70 l-20 -16 l-20 16 Z" fill="#1fa463"/><text x="230" y="1190" font-family="Manrope" font-size="42" font-weight="800" fill="#1fa463">Kaydet, sınavdan önce bak</text></g>

<script>
const S = 1;
const DUR = 73.6;           // ses süresi
const PH = [
 [0.00,1.19,"Bu gazı göremezsin,"],
 [1.50,2.51,"koklayamazsın da."],
 [2.86,4.27,"Adı karbon monoksit."],
 [4.63,9.21,"Soba, şofben ya da mangal yeterli oksijen olmadan yanarsa ortaya çıkar."],
 [9.53,10.92,"Buna eksik yanma denir."],
 [11.29,15.75,"Soluduğun oksijen, kanındaki alyuvarlarda hemoglobine bağlanarak taşınır."],
 [16.10,16.81,"Sorun şu:"],
 [17.07,21.94,"karbon monoksit hemoglobine oksijenden yaklaşık 200 kat daha sıkı bağlanır."],
 [22.31,25.22,"Oksijenin yerini kapar ve kolay kolay bırakmaz."],
 [25.46,26.91,"Kanın akmaya devam eder,"],
 [27.11,29.30,"ama artık yeterli oksijen taşıyamaz."],
 [29.54,33.68,"En çok etkilenen organlar, en çok oksijen harcayan beyin ve kalptir."],
 [34.01,37.54,"İlk belirtiler baş ağrısı, baş dönmesi ve bulantıdır."],
 [37.86,40.46,"Bunlar çoğu zaman grip ya da yorgunluk sanılır."],
 [40.79,41.79,"Kişi uyumak ister."],
 [42.12,44.96,"Uyurken zehirlenen biri ise hiç uyanmayabilir."],
 [45.25,48.32,"Bu yüzden karbon monoksite sessiz katil denir."],
 [48.62,51.45,"Korunmak için soba bacasını her kış temizlet,"],
 [51.66,56.31,"gece sobanın havasını kısarak yatma ve kapalı yerde asla mangal yakma."],
 [56.55,59.99,"En güvenlisi, evine bir karbon monoksit dedektörü takmaktır."],
 [60.31,65.98,"Birinde bu belirtileri görürsen hemen camları aç, onu temiz havaya çıkar ve 112'yi ara."],
 [66.30,71.17,"Peki sence, karbon monoksit zehirlenmesinde hastaya neden saf oksijen verilir?"]
];

// kelime zamanları (parça içinde harf sayısıyla orantılı) ve altyazı grupları (en çok 24 harf)
const W = [], CH = [];
PH.forEach(([a,b,txt]) => {
  const ws = txt.split(' '), tot = ws.reduce((s,w)=>s+w.length+1,0); let acc = 0, grp = [], len = 0;
  ws.forEach(w => { const st = a + (b-a)*acc/tot; acc += w.length+1;
    if (grp.length && len + w.length + 1 > 24) { CH.push(grp); grp = []; len = 0; }
    const o = {w, t: st, c: CH.length}; W.push(o); grp.push(o); len += w.length + 1; });
  if (grp.length) CH.push(grp);
});
const ease = x => x<0?0:x>1?1:1-Math.pow(1-x,3);
const cap = document.getElementById('cap'), bar = document.getElementById('bar');
document.querySelectorAll('[data-draw] path, path[data-draw]').forEach(p => { const L = p.getTotalLength(); p.style.strokeDasharray = L; p.dataset.len = L; });
let lastC = -1;
window.render = function (tv) {
  const t = tv * S;
  document.querySelectorAll('.scene').forEach(s => {
    const a = +s.dataset.s, e = +s.dataset.e;
    s.style.opacity = Math.min(ease((t-a)/0.4), 1 - ease((t-e+0.4)/0.4));
  });
  document.querySelectorAll('[data-in]').forEach(el => {
    const k = ease((t - +el.dataset.in)/0.5), b = +(el.dataset.base||0), o = el.dataset.out ? 1 - ease((t - +el.dataset.out)/0.4) : 1;
    el.style.opacity = (b + (1-b)*k) * o; el.style.transform = el.getAttribute('transform') ? '' : `translateY(${(1-k)*24}px)`;
  });
  document.querySelectorAll('[data-draw]').forEach(g => {
    const k = ease((t - +g.dataset.draw)/ +g.dataset.dur);
    (g.tagName==='path'?[g]:g.querySelectorAll('path')).forEach(p => p.style.strokeDashoffset = p.dataset.len*(1-k));
  });
  // altyazı
  let i = W.findIndex(o => o.t > t); i = (i === -1 ? W.length : i) - 1; if (i < 0) i = 0;
  const cur = W[i];
  if (cur.c !== lastC) { cap.innerHTML = CH[cur.c].map(o => `<span>${o.w}</span>`).join(''); lastC = cur.c; cap.style.fontSize='50px';
    if (cap.scrollWidth > 880) cap.style.fontSize = Math.floor(50*880/cap.scrollWidth)+'px'; }
  [...cap.children].forEach((s, j) => s.className = CH[cur.c][j] === cur ? 'on' : '');
  cap.style.opacity = t > 71.5 ? 0 : 1;
  bar.style.width = Math.min(100, t/DUR*100) + '%';
};
render(0);
</script></body></html>
