<g data-in="-1"><rect x="80" y="500" width="920" height="740" rx="18" fill="#fff" stroke="#1fa463" stroke-width="5"/><text x="140" y="590" text-anchor="start" font-size="32" font-weight="800" fill="#1fa463">ÖZET</text><circle cx="160" cy="680" r="14" fill="#1fa463"/><text x="200" y="694" text-anchor="start" font-size="40" font-weight="800" fill="#1d3557">İzotonik:</text><text x="200" y="744" text-anchor="start" font-size="40" font-weight="800" fill="#1fa463">net su geçişi yok</text><circle cx="160" cy="840" r="14" fill="#1fa463"/><text x="200" y="854" text-anchor="start" font-size="40" font-weight="800" fill="#1d3557">Hipotonik: su girer,</text><text x="200" y="904" text-anchor="start" font-size="40" font-weight="800" fill="#d63c63">alyuvar patlar (hemoliz)</text><circle cx="160" cy="1000" r="14" fill="#1fa463"/><text x="200" y="1014" text-anchor="start" font-size="40" font-weight="800" fill="#1d3557">Hipertonik: su çıkar,</text><text x="200" y="1064" text-anchor="start" font-size="40" font-weight="800" fill="#d94a5a">alyuvar büzüşür</text><path d="M140 1110 H940" stroke="#dbe3ee" stroke-width="3"/><path d="M160 1140 h40 v70 l-20 -16 l-20 16 Z" fill="#1fa463"/><text x="230" y="1190" text-anchor="start" font-family="Manrope" font-size="42" font-weight="800" fill="#1fa463">Kaydet, sınavdan önce bak</text></g>

</div>
<script>
const S = 1;                 // ses hızlandırılmadı
const DUR = 63.8;           // ses süresi
const PH = [
 [0.00,1.77,"Damara saf su verilmez."],
 [2.06,5.39,"Hastanede en çok kullanılan serumun içinde tuz vardır."],
 [5.71,7.92,"Sebebi, kanındaki alyuvarlardır."],
 [8.29,12.23,"Alyuvarın zarı seçici geçirgendir ve osmozla su alıp verir."],
 [12.55,17.17,"Su her zaman çözüneni az olan taraftan çözüneni çok olan tarafa geçer."],
 [17.52,20.39,"Bu serum, alyuvarın içiyle aynı derişimdedir."],
 [20.64,22.28,"Buna izotonik ortam denir."],
 [22.65,26.37,"Hücreye giren ve çıkan su eşittir, alyuvar şeklini korur."],
 [26.79,28.57,"Saf su ise hipotoniktir."],
 [28.87,30.60,"Su, alyuvarın içine dolar."],
 [30.94,35.19,"Bitki hücresinin aksine hayvan hücresinin onu tutacak bir duvarı yoktur."],
 [35.46,37.68,"Alyuvar şişer ve sonunda patlar."],
 [38.01,39.24,"Buna hemoliz denir."],
 [39.60,43.30,"Deney tüpünde kan, bulanık kırmızıdan berrak kırmızıya döner."],
 [43.61,47.26,"Çok tuzlu, yani hipertonik bir ortamda ise tersi olur."],
 [47.62,50.37,"Su alyuvardan çıkar ve hücre büzüşür."],
 [50.70,53.86,"Yani aynı hücre, bulunduğu sıvıya göre şişer,"],
 [54.08,56.00,"büzüşür ya da olduğu gibi kalır."],
 [56.45,61.52,"Peki sence, deniz suyu içmek susuzluğu neden gidermez, tersine artırır?"]
];

// kelime zamanları (parça içinde harf sayısıyla orantılı) ve altyazı grupları (en çok 24 harf)
const W = [], CH = [];
PH.forEach(([a,b,txt]) => {
  const ws = txt.split(' '), tot = ws.reduce((s,w)=>s+w.length+1,0); let acc = 0, grp = [], len = 0;
  ws.forEach(w => { const st = a + (b-a)*acc/tot; acc += w.length+1;
    if (grp.length && len + w.length + 1 > 24) { CH.push(grp); grp = []; len = 0; }
    const o = {w, t: st, c: CH.length}; W.push(o); grp.push(o); len += w.length + 1; });
  if (grp.length) CH.push(grp);
});
const ease = x => x<0?0:x>1?1:1-Math.pow(1-x,3);
const cap = document.getElementById('cap'), bar = document.getElementById('bar');
document.querySelectorAll('[data-draw] path, path[data-draw]').forEach(p => { const L = p.getTotalLength(); p.style.strokeDasharray = L; p.dataset.len = L; });
let lastC = -1;
window.render = function (tv) {
  const t = tv * S;
  document.querySelectorAll('.scene').forEach(s => {
    const a = +s.dataset.s, e = +s.dataset.e;
    s.style.opacity = Math.min(ease((t-a)/0.4), 1 - ease((t-e+0.4)/0.4));
  });
  document.querySelectorAll('[data-in]').forEach(el => {
    const k = ease((t - +el.dataset.in)/0.5), b = +(el.dataset.base||0), o = el.dataset.out ? 1 - ease((t - +el.dataset.out)/0.4) : 1;
    el.style.opacity = (b + (1-b)*k) * o; el.style.transform = el.getAttribute('transform') ? '' : `translateY(${(1-k)*24}px)`;
  });
  document.querySelectorAll('[data-draw]').forEach(g => {
    const k = ease((t - +g.dataset.draw)/ +g.dataset.dur);
    (g.tagName==='path'?[g]:g.querySelectorAll('path')).forEach(p => p.style.strokeDashoffset = p.dataset.len*(1-k));
  });
  // altyazı
  let i = W.findIndex(o => o.t > t); i = (i === -1 ? W.length : i) - 1; if (i < 0) i = 0;
  const cur = W[i];
  if (cur.c !== lastC) { cap.innerHTML = CH[cur.c].map(o => `<span>${o.w}</span>`).join(''); lastC = cur.c; cap.style.fontSize='50px';
    if (cap.scrollWidth > 880) cap.style.fontSize = Math.floor(50*880/cap.scrollWidth)+'px'; }
  [...cap.children].forEach((s, j) => s.className = CH[cur.c][j] === cur ? 'on' : '');
  cap.style.opacity = t > 61.5 ? 0 : 1;
  bar.style.width = Math.min(100, t/DUR*100) + '%';
};
render(0);
</script></body></html>
