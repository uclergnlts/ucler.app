<g data-in="-1"><rect x="80" y="500" width="920" height="740" rx="18" fill="#fff" stroke="#1fa463" stroke-width="5"/><text x="140" y="590" text-anchor="start" font-size="32" font-weight="800" fill="#1fa463">ÖZET</text><circle cx="160" cy="680" r="14" fill="#1fa463"/><text x="200" y="694" text-anchor="start" font-size="40" font-weight="800" fill="#1d3557">Osmoz: su, çözüneni az</text><text x="200" y="744" text-anchor="start" font-size="40" font-weight="800" fill="#1d3557">taraftan çoka geçer</text><circle cx="160" cy="840" r="14" fill="#1fa463"/><text x="200" y="854" text-anchor="start" font-size="40" font-weight="800" fill="#1d3557">Hipertonik: su çıkar,</text><text x="200" y="904" text-anchor="start" font-size="40" font-weight="800" fill="#d63c63">plazmoliz</text><circle cx="160" cy="1000" r="14" fill="#1fa463"/><text x="200" y="1014" text-anchor="start" font-size="40" font-weight="800" fill="#1d3557">Hipotonik: su girer,</text><text x="200" y="1064" text-anchor="start" font-size="40" font-weight="800" fill="#f08a24">turgor</text><path d="M140 1110 H940" stroke="#dbe3ee" stroke-width="3"/><path d="M160 1140 h40 v70 l-20 -16 l-20 16 Z" fill="#1fa463"/><text x="230" y="1190" text-anchor="start" font-family="Manrope" font-size="42" font-weight="800" fill="#1fa463">Kaydet, sınavdan önce bak</text></g>

<script>
const S = 1;                 // ses hızlandırılmadı
const DUR = 66.2;           // ses süresi
const PH = [
 [0.00,1.67,"Salatayı erken tuzlama."],
 [2.07,4.83,"Tuzladığın marul birkaç dakika sonra pörsür,"],
 [5.04,6.39,"kabın dibinde su birikir."],
 [6.65,9.45,"O su, marulun kendi hücrelerinden çıkmıştır."],
 [9.66,10.60,"Sebep osmozdur."],
 [10.60,13.40,"Su, seçici geçirgen zardan,"],
 [13.40,16.70,"çözüneni az olan taraftan çözüneni çok olan tarafa geçer."],
 [16.70,19.60,"Yani su, derişik tarafa doğru akar."],
 [19.60,23.52,"Tuz, yaprağın yüzeyinde çok derişik bir çözelti oluşturur."],
 [23.81,27.22,"Bu hipertonik ortamda su, hücrelerden dışarı çıkar."],
 [27.60,30.89,"Bitki hücresinin zarı, sert bir hücre duvarına yaslanır."],
 [31.15,35.00,"Su kaybeden hücrenin zarı duvardan ayrılır ve içe büzülür."],
 [35.31,36.65,"Buna plazmoliz denir."],
 [36.99,41.54,"Mikroskopta hücrenin içi, duvarın ortasında küçülmüş bir torba gibi görünür."],
 [41.88,43.74,"Hücreler gerginliğini kaybeder,"],
 [43.94,44.85,"yaprak pörsür."],
 [45.25,45.95,"Tersi de olur."],
 [46.22,51.71,"Pörsümüş marulu saf suya koyarsan su hücrelere girer ve zar yeniden duvara bastırır."],
 [51.96,53.80,"Bu düzelmeye deplazmoliz,"],
 [54.01,56.70,"hücrenin duvara yaptığı basınca turgor denir."],
 [56.97,58.39,"Marul yeniden diri olur."],
 [58.98,63.95,"Peki sence, reçele bol şeker konunca meyve neden aylarca bozulmaz?"]
];

// kelime zamanları (parça içinde harf sayısıyla orantılı) ve altyazı grupları (en çok 24 harf)
const W = [], CH = [];
PH.forEach(([a,b,txt]) => {
  const ws = txt.split(' '), tot = ws.reduce((s,w)=>s+w.length+1,0); let acc = 0, grp = [], len = 0;
  ws.forEach(w => { const st = a + (b-a)*acc/tot; acc += w.length+1;
    if (grp.length && len + w.length + 1 > 24) { CH.push(grp); grp = []; len = 0; }
    const o = {w, t: st, c: CH.length}; W.push(o); grp.push(o); len += w.length + 1; });
  if (grp.length) CH.push(grp);
});
const ease = x => x<0?0:x>1?1:1-Math.pow(1-x,3);
const cap = document.getElementById('cap'), bar = document.getElementById('bar');
document.querySelectorAll('[data-draw] path, path[data-draw]').forEach(p => { const L = p.getTotalLength(); p.style.strokeDasharray = L; p.dataset.len = L; });
let lastC = -1;
window.render = function (tv) {
  const t = tv * S;
  document.querySelectorAll('.scene').forEach(s => {
    const a = +s.dataset.s, e = +s.dataset.e;
    s.style.opacity = Math.min(ease((t-a)/0.4), 1 - ease((t-e+0.4)/0.4));
  });
  document.querySelectorAll('[data-in]').forEach(el => {
    const k = ease((t - +el.dataset.in)/0.5), b = +(el.dataset.base||0), o = el.dataset.out ? 1 - ease((t - +el.dataset.out)/0.4) : 1;
    el.style.opacity = (b + (1-b)*k) * o; el.style.transform = el.getAttribute('transform') ? '' : `translateY(${(1-k)*24}px)`;
  });
  document.querySelectorAll('[data-draw]').forEach(g => {
    const k = ease((t - +g.dataset.draw)/ +g.dataset.dur);
    (g.tagName==='path'?[g]:g.querySelectorAll('path')).forEach(p => p.style.strokeDashoffset = p.dataset.len*(1-k));
  });
  // altyazı
  let i = W.findIndex(o => o.t > t); i = (i === -1 ? W.length : i) - 1; if (i < 0) i = 0;
  const cur = W[i];
  if (cur.c !== lastC) { cap.innerHTML = CH[cur.c].map(o => `<span>${o.w}</span>`).join(''); lastC = cur.c; cap.style.fontSize='50px';
    if (cap.scrollWidth > 880) cap.style.fontSize = Math.floor(50*880/cap.scrollWidth)+'px'; }
  [...cap.children].forEach((s, j) => s.className = CH[cur.c][j] === cur ? 'on' : '');
  cap.style.opacity = t > 63.9 ? 0 : 1;
  bar.style.width = Math.min(100, t/DUR*100) + '%';
};
render(0);
</script></body></html>
