];
const END = PH[PH.length-1][1] + 0.3;   // soru bitti, sessiz özet kartı

// kelime zamanları (parça içinde harf sayısıyla orantılı) ve altyazı grupları (en çok 24 harf)
const W = [], CH = [];
PH.forEach(([a,b,txt]) => {
  const ws = txt.split(' '), tot = ws.reduce((s,w)=>s+w.length+1,0); let acc = 0, grp = [], len = 0;
  ws.forEach(w => { const st = a + (b-a)*acc/tot; acc += w.length+1;
    if (grp.length && len + w.length + 1 > 24) { CH.push(grp); grp = []; len = 0; }
    const o = {w, t: st, c: CH.length}; W.push(o); grp.push(o); len += w.length + 1; });
  if (grp.length) CH.push(grp);
});
// "kelime", "kelime#2", "kelime+0.4" -> saniye
function wt(spec) {
  if (spec === '@END') return END;
  const m = spec.match(/^(.+?)(?:#(\d+))?([+-][0-9.]+)?$/); let n = +(m[2]||1);
  const o = W.find(o => o.w === m[1] && --n === 0);
  if (!o) throw new Error('kelime yok: ' + spec);
  return o.t + +(m[3]||0);
}
document.querySelectorAll('[data-sw]').forEach(s => { if (s.dataset.s === undefined) s.dataset.s = wt(s.dataset.sw) - 0.15; });
document.querySelectorAll('[data-ew]').forEach(s => s.dataset.e = wt(s.dataset.ew) - 0.15 + 0.4);
document.querySelectorAll('[data-w]').forEach(el => el.dataset.in = wt(el.dataset.w) - 0.1);
document.querySelectorAll('[data-draw]').forEach(el => { if (isNaN(+el.dataset.draw)) el.dataset.draw = wt(el.dataset.draw); });
document.querySelectorAll('[data-type]').forEach(el => { el.dataset.full = el.textContent; el.dataset.t0 = wt(el.dataset.type); el.textContent = ''; });

const ease = x => x<0?0:x>1?1:1-Math.pow(1-x,3);
const cap = document.getElementById('cap'), bar = document.getElementById('bar');
document.querySelectorAll('[data-draw]').forEach(p => { const L = p.getTotalLength(); p.style.strokeDasharray = L; p.dataset.len = L; p.style.strokeDashoffset = L; });
let lastC = -1;
window.render = function (tv) {
  const t = tv * S;
  document.querySelectorAll('.scene').forEach(s => {
    const a = +s.dataset.s, e = +s.dataset.e;
    s.style.opacity = Math.min(ease((t-a)/0.4), 1 - ease((t-e+0.4)/0.4));
  });
  document.querySelectorAll('[data-in]').forEach(el => {
    const k = ease((t - +el.dataset.in)/0.5);
    el.style.opacity = k; el.style.transform = el.getAttribute('transform') ? '' : `translateY(${(1-k)*24}px)`;
  });
  document.querySelectorAll('[data-draw]').forEach(p => {
    const k = ease((t - +p.dataset.draw)/ +p.dataset.dur); p.style.strokeDashoffset = p.dataset.len*(1-k);
  });
  document.querySelectorAll('[data-type]').forEach(el => {
    const f = el.dataset.full, k = Math.max(0, Math.min(1, (t - +el.dataset.t0)/ +el.dataset.tdur));
    el.textContent = f.slice(0, Math.round(f.length*k));
  });
  // sürekli küçük hareketler: mum alevi, soru işaretleri, top atışı halkaları
  document.querySelectorAll('.alev').forEach(a => a.setAttribute('transform', `translate(540 900) scale(${1+0.06*Math.sin(t*9)} ${1+0.1*Math.sin(t*7)}) translate(-540 -900)`));
  document.querySelectorAll('.sall').forEach((q,i) => q.setAttribute('transform', `rotate(${6*Math.sin(t*3+i)} ${q.getAttribute('x')} ${+q.getAttribute('y')-30})`));
  document.querySelectorAll('.dalga').forEach(f => f.setAttribute('transform', `skewY(${1.2*Math.sin(t*2.4)}) scale(1 ${1+0.015*Math.sin(t*2.4+1)})`));
  document.querySelectorAll('.oypusula').forEach(o => { const k = ((t*0.6)%1); o.setAttribute('transform', `translate(0 ${k<0.6?k/0.6*70:70})`); o.style.opacity = k<0.6?1:1-(k-0.6)/0.4; });
  document.querySelectorAll('.burst').forEach(b => { const p = ((t*1.2)%1); b.querySelectorAll('circle').forEach((c,i) => c.setAttribute('transform', `scale(${1+0.3*((p+i/3)%1)})`)); });
  // altyazı
  let i = W.findIndex(o => o.t > t); i = (i === -1 ? W.length : i) - 1; if (i < 0) i = 0;
  const cur = W[i];
  if (cur.c !== lastC) { cap.innerHTML = CH[cur.c].map(o => `<span>${o.w}</span>`).join(''); lastC = cur.c; cap.style.fontSize='50px';
    if (cap.scrollWidth > 880) cap.style.fontSize = Math.floor(50*880/cap.scrollWidth)+'px'; }
  [...cap.children].forEach((s, j) => s.className = CH[cur.c][j] === cur ? 'on' : '');
  cap.style.opacity = t > END - 0.1 ? 0 : 1;
  bar.style.width = Math.min(100, t/(DUR+2)*100) + '%';
};
render(0);
