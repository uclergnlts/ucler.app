<!doctype html>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden}

.prog{position:absolute;left:80px;width:920px;top:1755px;height:6px;background:#e1e7ef;border-radius:3px}

</style></head><body><div id="stage"><div class="grid"></div>

<g data-in="32.4"><text x="540" y="620" text-anchor="middle" font-size="32" font-weight="600" fill="#5f6f88">kimyasal değişimin ipuçları</text></g><g data-in="34.9"><rect x="110" y="660" width="380" height="220" rx="18" fill="#fff" stroke="#dbe3ee" stroke-width="3"/><circle cx="270" cy="760" r="40" fill="#a8dadc" stroke="#1d3557" stroke-width="4"/><circle cx="335" cy="760" r="40" fill="#f4a3b8" stroke="#1d3557" stroke-width="4"/><text x="300" y="855" text-anchor="middle" font-size="30" font-weight="800" fill="#1d3557">renk değişir</text></g><g data-in="36.1"><rect x="590" y="660" width="380" height="220" rx="18" fill="#fff" stroke="#dbe3ee" stroke-width="3"/><circle cx="760" cy="790" r="18" fill="none" stroke="#1d3557" stroke-width="5"/><circle cx="800" cy="745" r="13" fill="none" stroke="#1d3557" stroke-width="5"/><circle cx="770" cy="715" r="9" fill="none" stroke="#1d3557" stroke-width="5"/><text x="780" y="855" text-anchor="middle" font-size="30" font-weight="800" fill="#1d3557">gaz çıkar</text></g><g data-in="37.0"><rect x="110" y="920" width="380" height="220" rx="18" fill="#fff" stroke="#dbe3ee" stroke-width="3"/><rect x="288" y="945" width="24" height="80" rx="12" fill="#fff" stroke="#1d3557" stroke-width="5"/><circle cx="300" cy="1035" r="22" fill="#d63c63" stroke="#1d3557" stroke-width="5"/><rect x="295" y="975" width="10" height="50" fill="#d63c63"/><text x="300" y="1115" text-anchor="middle" font-size="30" font-weight="800" fill="#1d3557">ısı yayılır</text></g><g data-in="37.8"><rect x="590" y="920" width="380" height="220" rx="18" fill="#fff" stroke="#dbe3ee" stroke-width="3"/><circle cx="780" cy="1000" r="30" fill="#ffd95a" stroke="#1d3557" stroke-width="5"/><path d="M780 952 v-14 M780 1048 v14 M732 1000 h-14 M828 1000 h14 M746 966 l-10 -10 M814 966 l10 -10 M746 1034 l-10 10 M814 1034 l10 10" stroke="#1d3557" stroke-width="5" stroke-linecap="round"/><text x="780" y="1115" text-anchor="middle" font-size="30" font-weight="800" fill="#1d3557">ışık yayılır</text></g><g data-in="38.8"><rect x="200" y="1200" width="680" height="110" rx="18" fill="#fff" stroke="#d63c63" stroke-width="4"/><text x="540" y="1268" text-anchor="middle" font-size="36" font-weight="800" fill="#d63c63">ipucu tek başına kanıt değil</text></g><g data-in="41.2"><text x="540" y="1380" text-anchor="middle" font-size="32" font-weight="600" fill="#1d3557">kaynayan su: gaz çıkar, ama hâlâ su</text></g>

<div class="scene" data-s="43.0" data-e="99">
 <div class="q"><small>DÜŞÜN</small>Yumurtayı haşlamak <em>fiziksel</em> mi, yoksa <em>kimyasal</em> bir değişim mi?</div>
</div>

<div class="cap" id="cap"></div>
<div class="prog"><i id="bar"></i></div>
</div>
<script>
const S = 1;                 // ses hızlandırılmadı
const DUR = 48.12;           // ses süresi
const PH = [
 [0.00,1.63,"Masada bir buz küpü eriyor."],
 [2.00,3.32,"Yanında bir kibrit yanıyor."],
 [3.67,6.89,"İkisinde de bir şey değişiyor, ama aynı türden değil."],
 [7.18,8.70,"Eriyen buz hâlâ sudur."],
 [9.04,10.56,"Dondurursan yine buz olur."],
 [10.89,12.39,"Maddenin kimliği değişmedi,"],
 [12.64,14.20,"yalnızca hâli değişti."],
 [14.45,16.01,"Buna fiziksel değişim denir."],
 [16.33,19.35,"Kâğıdı yırtmak ve şekeri suda çözmek de böyledir."],
 [19.62,22.19,"Yanan kibrit ise artık kibrit değildir."],
 [22.43,24.50,"Kül, duman ve gazlar oluştu;"],
 [24.71,26.65,"yani yeni maddeler ortaya çıktı."],
 [26.87,28.55,"Buna kimyasal değişim denir."],
 [28.88,32.03,"Demirin paslanması ve sütün ekşimesi de böyledir."],
 [32.29,34.69,"Kimyasal değişimi ipuçlarından tanırsın:"],
 [34.93,35.85,"renk değişir,"],
 [36.05,38.47,"gaz çıkar, ısı ya da ışık yayılır."],
 [38.71,40.95,"Ama ipucu tek başına kanıt değildir."],
 [41.18,42.78,"Suyu kaynatınca da gaz çıkar."],
 [43.10,48.12,"Peki sence, yumurtayı haşlamak fiziksel mi, yoksa kimyasal bir değişim mi?"]
];

// kelime zamanları (parça içinde harf sayısıyla orantılı) ve altyazı grupları (en çok 24 harf)
const W = [], CH = [];
PH.forEach(([a,b,txt]) => {
  const ws = txt.split(' '), tot = ws.reduce((s,w)=>s+w.length+1,0); let acc = 0, grp = [], len = 0;
  ws.forEach(w => { const st = a + (b-a)*acc/tot; acc += w.length+1;
    if (grp.length && len + w.length + 1 > 24) { CH.push(grp); grp = []; len = 0; }
    const o = {w, t: st, c: CH.length}; W.push(o); grp.push(o); len += w.length + 1; });
  if (grp.length) CH.push(grp);
});
const ease = x => x<0?0:x>1?1:1-Math.pow(1-x,3);
const cap = document.getElementById('cap'), bar = document.getElementById('bar');
document.querySelectorAll('[data-draw] path, path[data-draw]').forEach(p => { const L = p.getTotalLength(); p.style.strokeDasharray = L; p.dataset.len = L; });
let lastC = -1;
window.render = function (tv) {
  const t = tv * S;
  document.querySelectorAll('.scene').forEach(s => {
    const a = +s.dataset.s, e = +s.dataset.e;
    s.style.opacity = Math.min(ease((t-a)/0.4), 1 - ease((t-e+0.4)/0.4));
  });
  document.querySelectorAll('[data-in]').forEach(el => {
    const k = ease((t - +el.dataset.in)/0.5), b = +(el.dataset.base||0), o = el.dataset.out ? 1 - ease((t - +el.dataset.out)/0.4) : 1;
    el.style.opacity = (b + (1-b)*k) * o; el.style.transform = el.getAttribute('transform') ? '' : `translateY(${(1-k)*24}px)`;
  });
  document.querySelectorAll('[data-draw]').forEach(g => {
    const k = ease((t - +g.dataset.draw)/ +g.dataset.dur);
    (g.tagName==='path'?[g]:g.querySelectorAll('path')).forEach(p => p.style.strokeDashoffset = p.dataset.len*(1-k));
  });
  // altyazı
  let i = W.findIndex(o => o.t > t); i = (i === -1 ? W.length : i) - 1; if (i < 0) i = 0;
  const cur = W[i];
  if (cur.c !== lastC) { cap.innerHTML = CH[cur.c].map(o => `<span>${o.w}</span>`).join(''); lastC = cur.c; cap.style.fontSize='50px';
    if (cap.scrollWidth > 880) cap.style.fontSize = Math.floor(50*880/cap.scrollWidth)+'px'; }
  [...cap.children].forEach((s, j) => s.className = CH[cur.c][j] === cur ? 'on' : '');
  bar.style.width = Math.min(100, t/DUR*100) + '%';
};
render(0);
</script></body></html>
