<div class="cap" id="cap"></div>
<div class="prog"><i id="bar"></i></div>
</div>
<script>
const S = 1;                 // ses hızlandırılmadı
const DUR = 88.9;           // ses süresi
const PH = [
 [0.00,1.98,"Ateşin kırk biri geçerse ne olur?"],
 [2.35,5.77,"Üstelik vücudu on üç dereceye düşüp hayatta kalan biri var."],
 [6.18,7.35,"Önce ateşe bakalım."],
 [7.59,15.14,"Hastalandığında ateşinin otuz sekiz, otuz dokuz dereceye çıkması çoğu zaman bir savunmadır. Mikropların çoğalması yavaşlar,"],
 [15.35,16.95,"bağışıklık hücreleri hızlanır."],
 [17.24,19.99,"Ama kırk bir dereceyi geçen ateş tehlikelidir."],
 [20.29,20.68,"Neden?"],
 [20.95,21.37,"Cevap"],
 [21.61,22.36,"enzimlerde."],
 [22.65,26.10,"Hücrendeki neredeyse her tepkimeyi enzimler hızlandırır."],
 [26.39,29.17,"Enzim, belirli bir şekle katlanmış bir proteindir."],
 [29.51,34.05,"Üzerindeki aktif bölge, substratı bir anahtarı tutan kilit gibi kavrar."],
 [34.42,39.37,"Sıcaklık arttıkça moleküller hızlanır, çarpışmalar artar ve tepkime hızlanır."],
 [39.75,42.95,"İnsan enzimleri otuz yedi derecede en hızlı çalışır."],
 [43.23,49.54,"Daha sıcakta ise moleküller o kadar şiddetli titreşir ki enzimin şeklini tutan zayıf bağlar kopar."],
 [49.88,55.03,"Aktif bölge bozulur ve enzim artık işini yapamaz. Buna denatürasyon denir ve"],
 [55.31,57.05,"çoğu zaman geri dönmez."],
 [57.27,58.95,"En hassas organ beyindir."],
 [59.27,60.65,"Soğuk ise farklıdır."],
 [61.03,66.40,"Bin dokuz yüz doksan dokuzda Norveçli genç bir doktor, kayak yaparken buzlu bir dereye düştü."],
 [66.63,69.53,"Vücut sıcaklığı on üç virgül yedi dereceye indi."],
 [69.75,71.62,"Enzimleri neredeyse durmuştu"],
 [71.85,73.08,"ama bozulmamıştı."],
 [73.31,76.09,"Hastanede yavaşça ısıtıldı ve iyileşti."],
 [76.33,80.25,"Yani soğuk enzimi yavaşlatır, aşırı sıcak ise bozar."],
 [80.62,81.38,"Peki sence,"],
 [81.59,86.43,"seksen derecelik kaplıca suyunda yaşayan bakterilerin enzimleri neden bozulmaz?"]
];

// kelime zamanları (parça içinde harf sayısıyla orantılı) ve altyazı grupları (en çok 24 harf)
const W = [], CH = [];
PH.forEach(([a,b,txt]) => {
  const ws = txt.split(' '), tot = ws.reduce((s,w)=>s+w.length+1,0); let acc = 0, grp = [], len = 0;
  ws.forEach(w => { const st = a + (b-a)*acc/tot; acc += w.length+1;
    if (grp.length && len + w.length + 1 > 24) { CH.push(grp); grp = []; len = 0; }
    const o = {w, t: st, c: CH.length}; W.push(o); grp.push(o); len += w.length + 1; });
  if (grp.length) CH.push(grp);
});
const ease = x => x<0?0:x>1?1:1-Math.pow(1-x,3);
const cap = document.getElementById('cap'), bar = document.getElementById('bar');
document.querySelectorAll('[data-draw] path, path[data-draw]').forEach(p => { const L = p.getTotalLength(); p.style.strokeDasharray = L; p.dataset.len = L; });
let lastC = -1;
window.render = function (tv) {
  const t = tv * S;
  document.querySelectorAll('.scene').forEach(s => {
    const a = +s.dataset.s, e = +s.dataset.e;
    s.style.opacity = Math.min(ease((t-a)/0.4), 1 - ease((t-e+0.4)/0.4));
  });
  document.querySelectorAll('[data-in]').forEach(el => {
    const k = ease((t - +el.dataset.in)/0.5), b = +(el.dataset.base||0), o = el.dataset.out ? 1 - ease((t - +el.dataset.out)/0.4) : 1;
    el.style.opacity = (b + (1-b)*k) * o; el.style.transform = el.getAttribute('transform') ? '' : `translateY(${(1-k)*24}px)`;
  });
  document.querySelectorAll('[data-draw]').forEach(g => {
    const k = ease((t - +g.dataset.draw)/ +g.dataset.dur);
    (g.tagName==='path'?[g]:g.querySelectorAll('path')).forEach(p => p.style.strokeDashoffset = p.dataset.len*(1-k));
  });
  // altyazı
  let i = W.findIndex(o => o.t > t); i = (i === -1 ? W.length : i) - 1; if (i < 0) i = 0;
  const cur = W[i];
  if (cur.c !== lastC) { cap.innerHTML = CH[cur.c].map(o => `<span>${o.w}</span>`).join(''); lastC = cur.c; cap.style.fontSize='50px';
    if (cap.scrollWidth > 880) cap.style.fontSize = Math.floor(50*880/cap.scrollWidth)+'px'; }
  [...cap.children].forEach((s, j) => s.className = CH[cur.c][j] === cur ? 'on' : '');
  cap.style.opacity = t > 86.6 ? 0 : 1;
  bar.style.width = Math.min(100, t/DUR*100) + '%';
};
render(0);
</script></body></html>
