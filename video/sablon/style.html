<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts-local.css">
<style>
/* Deney defteri (açık) ve karanlık oda (koyu): uygulamadaki app/globals.css ile aynı renkler.
   Koyu video için <html data-tema="koyu"> yazılır; önizlemede adrese ?tema=koyu eklemek de yeter.
   Ders rengi: #stage'e data-ders="fizik|kimya|biyoloji" yazılır. Çizimlerde hex yerine bu değişkenler kullanılır. */
:root{--bg:#f6f4ef;--surface:#fffdf8;--grid:#e2dccf;--ink:#16181d;--muted:#5b616b;--line:#cdc5b5;--gri:#a8a296;--vurgu:#ffd95a;--vurgu-bas:62%;--altin:#b8860b;--on-vurgu:#16181d;
 --c1:#2f6fd6;--c2:#c8344f;--c3:#1b8a52;--c4:#c98a00;--c5:#7a4fd0;--acc:#c8344f;--golge:0 8px 24px rgba(22,24,29,.08)}
:root[data-tema="koyu"]{--bg:#0f1114;--surface:#171a1f;--grid:#20252c;--ink:#f1efe9;--muted:#a7aeb8;--line:#343a43;--gri:#6b7480;--vurgu:#f2b33d;--vurgu-bas:90%;--altin:#f2b33d;
 --c1:#4a8af0;--c2:#e8557c;--c3:#27a866;--c4:#e0a020;--c5:#9468e8;--acc:#f2b33d;--golge:none}
[data-ders="fizik"]{--acc:var(--c1)}[data-ders="kimya"]{--acc:var(--c2)}[data-ders="biyoloji"]{--acc:var(--c3)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden}
#stage{position:relative;width:1080px;height:1920px;background:var(--bg);color:var(--ink);font-family:Inter,sans-serif;overflow:hidden}
.grid{position:absolute;inset:0;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:60px 60px;opacity:.55}
.head{position:absolute;left:80px;right:80px;top:265px;display:flex;justify-content:space-between;align-items:center;font-family:Manrope;font-weight:800;font-size:30px;letter-spacing:3px}
.head .sub{display:flex;align-items:center;gap:16px;color:var(--acc)}
.head .sub i{display:block;width:44px;height:6px;background:var(--acc);border-radius:3px}
.head .brand{letter-spacing:-0.5px;font-size:38px;color:var(--ink)}
.head .brand b{color:var(--acc)}
.title{position:absolute;left:80px;right:80px;top:345px;font-family:Manrope;font-weight:800;font-size:78px;line-height:1.08;letter-spacing:-1.5px}
.title em{font-style:normal;background:linear-gradient(transparent var(--vurgu-bas),var(--vurgu) var(--vurgu-bas))}
svg.v{position:absolute;left:0;top:0;width:1080px;height:1920px}
.cap{position:absolute;left:80px;width:860px;top:1405px;height:110px;background:var(--surface);border:2px solid var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:50px;box-shadow:var(--golge)}
.cap span.on{background:linear-gradient(transparent var(--vurgu-bas),var(--vurgu) var(--vurgu-bas))}
.q{position:absolute;left:80px;right:80px;top:640px;font-family:Manrope;font-weight:800;font-size:92px;line-height:1.1;letter-spacing:-2px}
.q small{display:block;font-size:34px;letter-spacing:3px;color:var(--acc);margin-bottom:34px}
.prog{position:absolute;left:80px;width:860px;top:1545px;height:6px;background:var(--line);border-radius:3px}
.prog i{display:block;height:100%;background:var(--acc);border-radius:3px}
</style><script>if(new URLSearchParams(location.search).get("tema")==="koyu")document.documentElement.dataset.tema="koyu"</script></head><body><div id="stage" data-ders="kimya"><div class="grid"></div>
<div class="head"><div class="sub"><i></i>KİMYA</div><div class="brand">ucler<b>.</b></div></div>
<div id="c"></div>
</div>

 <circle cx="290" cy="930" r="56" fill="var(--gri)" stroke="var(--ink)" stroke-width="4"/>
 <circle cx="790" cy="930" r="56" fill="var(--vurgu)" stroke="var(--ink)" stroke-width="4"/>
 <text x="290" y="944" text-anchor="middle" font-family="Manrope" font-weight="800" font-size="38" fill="var(--ink)">82 p</text>

 <text x="290" y="1215" text-anchor="middle" font-family="Manrope" font-weight="800" font-size="56" fill="var(--ink)">Pb</text>
 <text x="290" y="1262" text-anchor="middle" font-family="Inter" font-weight="600" font-size="32" fill="var(--muted)">kurşun</text>
 <text x="790" y="1215" text-anchor="middle" font-family="Manrope" font-weight="800" font-size="56" fill="var(--ink)">Au</text>

 <path d="M500 930 H580" stroke="var(--ink)" stroke-width="5"/><path d="M570 916 l18 14 -18 14" stroke="var(--ink)" stroke-width="5" fill="none"/>

 <text x="540" y="1340" text-anchor="middle" font-family="Inter" font-weight="600" font-size="32" fill="var(--muted)">Kimyasal tepkime çekirdeğe dokunmaz</text>

<div class="cap"><span>Kurşunda</span>&nbsp;<span class="on">seksen iki</span>&nbsp;<span>proton</span></div>
<div class="prog"><i style="width:58%"></i></div>`,
'3': `<div class="q"><small>DÜŞÜN</small>Hiç gerçekleşmeyen bir hayal, bilime nasıl bu kadar çok şey <em style="font-style:normal;background:linear-gradient(transparent var(--vurgu-bas),var(--vurgu) var(--vurgu-bas))">kazandırmış</em> olabilir?</div>
<div class="cap"><span>bilime</span>&nbsp;<span class="on">nasıl</span>&nbsp;<span>bu kadar</span></div>
<div class="prog"><i style="width:97%"></i></div>`
};
c.innerHTML = frames[f];
</script></body></html>
